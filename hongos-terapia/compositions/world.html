  <script>
    (function () {
      const DUR = 50.0;
      const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));

      const io = (x) => x * x * x * (x * (x * 6 - 15) + 10);
      const eOut = (x) => 1 - Math.pow(1 - x, 3);
      const eIn = (x) => x * x * x;
      const settle = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.exp(-5.5 * x) * Math.cos(6.5 * x));
      const mix = (a, b, x) => a + (b - a) * x;
      function rng(seed) {
        return function () {
          seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
          let r = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
          return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
        };
      }
      const C = (hex) => new THREE.Color(hex);

      // Paleta natural (tomada de la imagen de referencia): pizarra azul grisácea, arena soleada, crema,
      // café de hongo, verde oliva y ocre cálido. Rojo ladrillo solo para alertas y la nota a mano.
      const P = {
        wall: "#75828b", wallWarm: "#cdbfa4", table: "#d8cbb1", cream: "#f3ead8", ink: "#262b2f",
        cap: "#8d6a45", gill: "#cdb38a", stem: "#d9c7a3", olive: "#55683a", oliveL: "#6f8445", ochre: "#b98a4e",
        slate: "#4f5c65", clay: "#b49a7c", brick: "#a8452f", oak: "#9c7b58", sage: "#7f8c5e",
      };

      // El render 3D va a un canvas fuera de pantalla y se acumula en #w-canvas (motion blur real).
      const canvas = document.getElementById("w-canvas");
      const outCtx = canvas.getContext("2d");
      const glCanvas = document.createElement("canvas");
      const renderer = new THREE.WebGLRenderer({ canvas: glCanvas, antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1.5);
      renderer.setSize(1080, 1920, false);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.05;

      const scene = new THREE.Scene();
      const envScene = new THREE.Scene();
      envScene.background = new THREE.Color("#2a3036");
      const envPanel = (w, h, hex, k, x, y, z) => {
        const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(hex).multiplyScalar(k), side: THREE.DoubleSide }));
        m.position.set(x, y, z);
        m.lookAt(0, 0, 0);
        envScene.add(m);
      };
      envPanel(8, 8, "#fff3df", 1.8, 0, 10, 0);
      envPanel(5, 6, "#ffe6c0", 2.4, 8, 4, 6);
      envPanel(6, 8, "#8297a8", 1.4, -8, 2, -2);
      envPanel(12, 2, "#c9a46a", 1.0, 0, 1, -9);
      const pmrem = new THREE.PMREMGenerator(renderer);
      scene.environment = pmrem.fromScene(envScene, 0.04).texture;
      const camera = new THREE.PerspectiveCamera(35, 1080 / 1920, 0.1, 900);
      const hemi = new THREE.HemisphereLight(0xc4ced6, 0x6a5e4e, 0.85);
      scene.add(hemi);
      const sunLight = new THREE.DirectionalLight(0xffe7c2, 3.0);
      sunLight.castShadow = true;
      sunLight.shadow.mapSize.set(2048, 2048);
      sunLight.shadow.bias = -0.0005;
      sunLight.shadow.normalBias = 0.02;
      sunLight.shadow.radius = 5;
      scene.add(sunLight, sunLight.target);
      const rimLight = new THREE.DirectionalLight(0x9db2c4, 0.55);
      rimLight.position.set(-14, 10, -10);
      scene.add(rimLight);

      // Ventana invisible: bloquea el sol salvo por dos paños, y así dibuja el haz de luz diagonal de la referencia.
      const occMat = new THREE.MeshBasicMaterial({ colorWrite: false, depthWrite: false, side: THREE.DoubleSide });
      const occShape = new THREE.Shape();
      occShape.moveTo(-40, -40); occShape.lineTo(40, -40); occShape.lineTo(40, 40); occShape.lineTo(-40, 40); occShape.lineTo(-40, -40);
      [[-1.65, 1.5], [0.15, 1.5]].forEach(([x, w]) => {
        const p = new THREE.Path();
        p.moveTo(x, -3.4); p.lineTo(x + w, -3.4); p.lineTo(x + w, 3.4); p.lineTo(x, 3.4); p.lineTo(x, -3.4);
        occShape.holes.push(p);
      });
      const occ = new THREE.Mesh(new THREE.ShapeGeometry(occShape), occMat);
      occ.castShadow = true; occ.receiveShadow = false; occ.frustumCulled = false;
      scene.add(occ);

      const bloomEl = document.getElementById("w-bloom");
      const bctx = bloomEl.getContext("2d");
      const sweepEl = document.getElementById("w-sweep");
      const gradC = document.createElement("canvas");
      gradC.width = 4; gradC.height = 256;
      const gctx = gradC.getContext("2d");
      const grd = gctx.createLinearGradient(0, 0, 0, 256);
      grd.addColorStop(0, "#1d2529"); grd.addColorStop(0.5, "#46535b"); grd.addColorStop(1, "#8f8572");
      gctx.fillStyle = grd; gctx.fillRect(0, 0, 4, 256);
      const gradTex = new THREE.CanvasTexture(gradC);
      gradTex.colorSpace = THREE.SRGBColorSpace;

      /* ---------- Piezas lisas ---------- */
      const mat = (color, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color, flatShading: false, roughness: 0.78, metalness: 0 }, o));
      const basic = (color, o = {}) => new THREE.MeshBasicMaterial(Object.assign({ color }, o));
      function add(geo, color, x, y, z, parent, o = {}) {
        const m = new THREE.Mesh(geo, color && color.isMaterial ? color : mat(color));
        m.position.set(x, y, z);
        m.castShadow = o.cast !== false;
        m.receiveShadow = o.recv !== false;
        parent.add(m);
        return m;
      }
      const box = (w, h, d, color, x, y, z, parent, o) => add(new THREE.BoxGeometry(w, h, d), color, x, y, z, parent, o);
      const cyl = (r1, r2, h, color, x, y, z, parent, o) => add(new THREE.CylinderGeometry(r1, r2, h, 48), color, x, y, z, parent, o);
      const ball = (r, color, x, y, z, parent, o) => add(new THREE.SphereGeometry(r, 40, 28), color, x, y, z, parent, o);
      const group = (parent, x = 0, y = 0, z = 0) => { const g = new THREE.Group(); g.position.set(x, y, z); parent.add(g); return g; };
      function roundedGeo(w, h, d, r) {
        r = Math.min(r, Math.min(w, h, d) / 2 - 0.001);
        const s = new THREE.Shape();
        const x = -w / 2 + r, y = -h / 2 + r, iw = w - 2 * r, ih = h - 2 * r;
        s.moveTo(x, y - r);
        s.lineTo(x + iw, y - r);
        s.absarc(x + iw, y, r, -Math.PI / 2, 0, false);
        s.lineTo(x + iw + r, y + ih);
        s.absarc(x + iw, y + ih, r, 0, Math.PI / 2, false);
        s.lineTo(x, y + ih + r);
        s.absarc(x, y + ih, r, Math.PI / 2, Math.PI, false);
        s.lineTo(x - r, y);
        s.absarc(x, y, r, Math.PI, Math.PI * 1.5, false);
        const g = new THREE.ExtrudeGeometry(s, { depth: Math.max(0.001, d - 2 * r), bevelEnabled: true, bevelThickness: r, bevelSize: r, bevelOffset: -r, bevelSegments: 6, curveSegments: 10 });
        g.translate(0, 0, -(d - 2 * r) / 2);
        return g;
      }
      const rb = (w, h, d, r, color, x, y, z, parent, o) => add(roundedGeo(w, h, d, r), color, x, y, z, parent, o);
      const latheGeo = (pts, seg = 72) => new THREE.LatheGeometry(pts.map((p) => new THREE.Vector2(p[0], p[1])), seg);
      function lathe(points, color, x, y, z, parent, o) { return add(latheGeo(points), color, x, y, z, parent, o); }
      // Perfil suavizado (spline) para que la silueta no muestre quiebres.
      const smooth = (pts, n = 48) => new THREE.SplineCurve(pts.map((p) => new THREE.Vector2(p[0], p[1]))).getPoints(n).map((v) => [Math.max(0, v.x), v.y]);
      const ell = (parent, m, x, y, z, sx, sy, sz, o) => { const b = ball(1, m, x, y, z, parent, o); b.scale.set(sx, sy, sz); return b; };
      // Texturas de texto: se dibujan al cargar y otra vez cuando las fuentes están listas.
      const painters = [];
      function paintTex(w, h, draw) {
        const c = document.createElement("canvas");
        c.width = w; c.height = h;
        const tx = new THREE.CanvasTexture(c);
        tx.colorSpace = THREE.SRGBColorSpace;
        tx.anisotropy = 8;
        const run = () => { const x = c.getContext("2d"); x.clearRect(0, 0, w, h); draw(x, w, h); tx.needsUpdate = true; };
        run();
        painters.push(run);
        return tx;
      }
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => painters.forEach((p) => p()));
      function rr(c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); }
      function txt(c, s, x, y, font, color, align = "center") { c.font = font; c.fillStyle = color; c.textAlign = align; c.textBaseline = "middle"; c.fillText(s, x, y); }
      const MONT = (px) => "700 " + px + "px Montserrat, sans-serif";
      const BAHN = (px) => px + "px Bahnschrift, sans-serif";
      function plane(w, h, tex, x, y, z, parent, o = {}) {
        const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), o.lit ? mat("#ffffff", { map: tex, roughness: 0.85, transparent: !!o.transparent }) : basic("#ffffff", { map: tex, transparent: o.transparent !== false, depthWrite: !o.transparent }));
        m.position.set(x, y, z);
        m.castShadow = false; m.receiveShadow = !!o.lit;
        parent.add(m);
        return m;
      }
      const puffCanvas = document.createElement("canvas");
      puffCanvas.width = puffCanvas.height = 128;
      const pctx = puffCanvas.getContext("2d");
      const pgrad = pctx.createRadialGradient(64, 64, 4, 64, 64, 64);
      pgrad.addColorStop(0, "rgba(255,255,255,1)");
      pgrad.addColorStop(0.5, "rgba(255,255,255,0.45)");
      pgrad.addColorStop(1, "rgba(255,255,255,0)");
      pctx.fillStyle = pgrad;
      pctx.fillRect(0, 0, 128, 128);
      const puffTex = new THREE.CanvasTexture(puffCanvas);
      const glowMat = (color, op = 0) => new THREE.SpriteMaterial({ map: puffTex, color, transparent: true, opacity: op, depthWrite: false, blending: THREE.AdditiveBlending });
      const steamMat = (op = 0) => new THREE.SpriteMaterial({ map: puffTex, color: "#f6f1e8", transparent: true, opacity: op, depthWrite: false });
      const glassM = () => new THREE.MeshStandardMaterial({ color: "#eef3f4", transparent: true, opacity: 0.2, roughness: 0.04, metalness: 0, envMapIntensity: 1.6, depthWrite: false, side: THREE.DoubleSide });
      const liquidM = (hex, op) => new THREE.MeshStandardMaterial({ color: hex, transparent: true, opacity: op, roughness: 0.1, depthWrite: false });

      // Mesa de piedra arena y pared de pizarra (el ambiente de la referencia).
      function roomBase(parent, wallHex, tableHex) {
        rb(40, 0.5, 18, 0.12, mat(tableHex, { roughness: 0.86 }), 0, -0.25, 5.8, parent);
        box(44, 18, 0.4, mat(wallHex, { roughness: 0.96 }), 0, 8.8, -3.2, parent, { cast: false });
      }

      /* ---------- Piezas reutilizables ---------- */
      const capM = mat(P.cap, { roughness: 0.6 });
      const gillM = mat(P.gill, { roughness: 0.92, side: THREE.DoubleSide });
      const stemM = mat(P.stem, { roughness: 0.8 });
      // Hongo seco liso: pie levemente curvo, sombrero en domo con mamelón y laminillas claras.
      function mushroom(parent, s) {
        const g = group(parent);
        g.scale.setScalar(s);
        const curve = new THREE.CatmullRomCurve3([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0.03, 0.25, 0), new THREE.Vector3(0.02, 0.5, 0.01), new THREE.Vector3(-0.01, 0.68, 0)]);
        add(new THREE.TubeGeometry(curve, 32, 0.06, 20, false), stemM, 0, 0, 0, g);
        ball(0.062, stemM, 0, 0, 0, g);
        lathe([[0.31, 0.64], [0.33, 0.67], [0.31, 0.76], [0.25, 0.86], [0.16, 0.93], [0.07, 0.97], [0.03, 1.0], [0, 1.01]], capM, 0, 0, 0, g);
        lathe([[0.31, 0.64], [0.2, 0.67], [0.07, 0.69], [0, 0.69]], gillM, 0, 0, 0, g, { cast: false });
        return g;
      }
      // Cápsula de dos colores (crema y ocre).
      function capsule(parent, r, len) {
        const g = group(parent);
        const a = mat("#ede5d3", { roughness: 0.32 }), b = mat("#b07f45", { roughness: 0.32 });
        [[a, 1], [b, -1]].forEach(([m, sg]) => {
          cyl(r, r, len / 2, m, 0, sg * len / 4, 0, g);
          const h = add(new THREE.SphereGeometry(r, 40, 20, 0, Math.PI * 2, 0, Math.PI / 2), m, 0, sg * len / 2, 0, g);
          if (sg < 0) h.rotation.x = Math.PI;
        });
        return g;
      }
      function glassOfWater(parent, x, z, s) {
        const g = group(parent, x, 0, z);
        g.scale.setScalar(s);
        add(latheGeo([[0, 0], [0.36, 0], [0.39, 0.03], [0.44, 1.2], [0.42, 1.2], [0.37, 0.07], [0, 0.07]]), glassM(), 0, 0, 0, g, { cast: false });
        add(latheGeo([[0, 0.075], [0.37, 0.075], [0.405, 0.82], [0, 0.82]]), liquidM("#c7d8de", 0.32), 0, 0, 0, g, { cast: false });
        return g;
      }
      function plant(parent, x, z, s) {
        const g = group(parent, x, 0, z);
        g.scale.setScalar(s);
        lathe([[0, 0], [0.42, 0], [0.47, 0.06], [0.55, 0.78], [0.58, 0.82], [0.55, 0.84], [0, 0.84]], mat("#d8d0c0", { roughness: 0.55 }), 0, 0, 0, g);
        const r = rng(9);
        for (let i = 0; i < 9; i++) {

          teapot.position.y = 0.16 * hop;
          teapot.rotation.z = -0.06 * hop;
          lid.position.y = 0.88 + 0.07 * (t >= 45.9 && t < 46.25 ? Math.sin(Math.PI * (t - 45.9) / 0.35) : 0);
          const tip = settle(prog(t, 46.05, 46.6));
          teaCap.rotation.set(0, 0, tip * (Math.PI / 2));
          teaCap.position.set(-tip * 0.06, 0.62 - tip * 0.3 + Math.sin(t * 1.6) * 0.03 * (1 - tip), 0);
        }
      }

      // Motion blur real: 6 muestras dentro de un obturador de 180° a 60 fps (1/120 s), promediadas.
      // Nunca mezcla dos tomas: las muestras no retroceden antes del inicio de la toma actual.
      const SUBS = 6, SHUTTER = 1 / 120;
      const grainEl = document.getElementById("w-grain");
      const grctx = grainEl.getContext("2d");
      const grImg = grctx.createImageData(540, 960);
      function drawGrain(t) {
        const r = rng(Math.round(t * 60) + 7);
        const d = grImg.data;
        for (let i = 0; i < d.length; i += 4) { const g = r() * 255; d[i] = d[i + 1] = d[i + 2] = g; d[i + 3] = 255; }
        grctx.putImageData(grImg, 0, 0);
      }
      const n68 = document.getElementById("n-68");
      function updateHtml(t) { n68.textContent = String(Math.round(68 * eOut(prog(t, 23.93, 24.55)))); }
      function renderAt(t) {
        t = clamp(t, 0, DUR - 1 / 120);
        const shot = SHOTS.find((s) => t >= s.a && t < s.b) || SHOTS[SHOTS.length - 1];
        outCtx.globalCompositeOperation = "source-over";
        for (let k = SUBS - 1; k >= 0; k--) {
          const tk = Math.max(shot.a, t - (k / (SUBS - 1)) * SHUTTER);
          updateScene(tk, shot);
          renderer.render(scene, camera);
          outCtx.globalAlpha = 1 / (SUBS - k);
          outCtx.drawImage(glCanvas, 0, 0);
        }
        outCtx.globalAlpha = 1;
        drawGrain(t);
        updateHtml(t);
        let blur = 0;
        for (const cut of BLUR_CUTS) {
          if (t >= cut - 0.26 && t < cut) blur = Math.max(blur, 26 * eIn(prog(t, cut - 0.26, cut)));
          if (t >= cut && t < cut + 0.42) blur = Math.max(blur, 26 * (1 - eOut(prog(t, cut, cut + 0.42))));
        }
        canvas.style.filter = blur > 0.05 ? "blur(" + blur.toFixed(2) + "px)" : "none";
        canvas.style.transform = blur > 0.05 ? "scale(" + (1 + blur * 0.004).toFixed(4) + ")" : "none";
        bctx.globalCompositeOperation = "source-over";
        bctx.drawImage(canvas, 0, 0, 270, 480);
        bctx.globalCompositeOperation = "multiply";
        bctx.drawImage(canvas, 0, 0, 270, 480);
        bctx.drawImage(canvas, 0, 0, 270, 480);
        bctx.drawImage(canvas, 0, 0, 270, 480);
        bloomEl.style.filter = "blur(" + (16 + blur).toFixed(1) + "px)";
        let sw = 0;
        for (const cut of BLUR_CUTS) if (t >= cut - 0.2 && t < cut + 0.2) sw = prog(t, cut - 0.2, cut + 0.2);
        sweepEl.style.opacity = sw > 0 ? String(Math.sin(Math.PI * sw)) : "0";
        sweepEl.style.transform = "translateY(" + (sw * 1920).toFixed(1) + "px)";
      }

      // Todo texto entra y sale con Fade In y Fade Out.
      const tl = gsap.timeline({ paused: true });
      [["#c-hito", 2.04, 3.9], ["#c-ley", 5.3, 7.65], ["#c-isp", 9.75, 11.95], ["#c-primer", 12.09, 15.25], ["#t-src1", 9.75, 15.25],
       ["#c-psilo", 15.4, 17.7], ["#c-drt", 18.9, 22.55], ["#t-src2", 18.9, 22.55], ["#c-68", 23.85, 25.85], ["#t-src3", 22.75, 25.85],
       ["#c-micro", 25.9, 27.05], ["#c-macro", 27.15, 29.75], ["#t-src4", 25.9, 29.75], ["#c-ego", 31.6, 33.55], ["#c-chile", 37.15, 40.2],
       ["#c-vs", 40.45, 42.3], ["#c-cta", 47.19, 49.95]].forEach(([sel, at, end]) => {
        tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "sine.inOut" }, at);
        tl.to(sel, { opacity: 0, duration: 0.28, ease: "sine.inOut" }, end - 0.29);
      });
      // "Microdosis" se tacha limpiamente.
      tl.fromTo("#k-strike", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power2.out" }, 26.05);
      // Nota a mano: se escribe de izquierda a derecha y se desvanece.
      tl.fromTo("#n-nota", { clipPath: "inset(-30% 100% -30% -5%)", opacity: 0 }, { clipPath: "inset(-30% -5% -30% -5%)", opacity: 1, duration: 0.55, ease: "sine.inOut" }, 41.99);
      tl.to("#n-nota", { opacity: 0, duration: 0.28, ease: "sine.inOut" }, 45.75);
      // Fundido final a negro (sin créditos).
      tl.fromTo("#e-bg", { opacity: 0 }, { opacity: 1, duration: 0.7, ease: "sine.inOut" }, 50.0);
      tl.set({}, {}, 51.0);
      window.__timelines["world"] = tl;

      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      renderAt(0);
    })();
  </script>
</template>
