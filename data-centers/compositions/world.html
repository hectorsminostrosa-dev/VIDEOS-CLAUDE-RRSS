      const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
      const prog = (t, a, b) => clamp((t - a) / (b - a));
      const io = (x) => x * x * x * (x * (x * 6 - 15) + 10);
      const eOut = (x) => 1 - Math.pow(1 - x, 3);

      const settle = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.exp(-5.5 * x) * Math.cos(6.5 * x));

          let r = Math.imul(seed ^ (seed >>> 15), 1 | seed);

          return ((r ^ (r >>> 14)) >>> 0) / 4294967296;

      }
      const C = (hex) => new THREE.Color(hex);

      /* ---------- RENDER ---------- */

      function gradTexOf(stops) {

      function roundedGeo(w, h, d, r) {
        r = Math.min(r, Math.min(w, h, d) / 2 - 0.001);
        const s = new THREE.Shape();
        const x = -w / 2 + r, y = -h / 2 + r, iw = w - 2 * r, ih = h - 2 * r;
        s.moveTo(x, y - r);
        s.lineTo(x + iw, y - r);
        s.absarc(x + iw, y, r, -Math.PI / 2, 0, false);
        s.lineTo(x + iw + r, y + ih);
        s.absarc(x + iw, y + ih, r, 0, Math.PI / 2, false);
        s.lineTo(x, y + ih + r);
        s.absarc(x, y + ih, r, Math.PI / 2, Math.PI, false);
        s.lineTo(x - r, y);
        s.absarc(x, y, r, Math.PI, Math.PI * 1.5, false);
        const g = new THREE.ExtrudeGeometry(s, { depth: Math.max(0.001, d - 2 * r), bevelEnabled: true, bevelThickness: r, bevelSize: r, bevelOffset: -r, bevelSegments: 6, curveSegments: 10 });
        g.translate(0, 0, -(d - 2 * r) / 2);
        return g;
      }
      const rb = (w, h, d, r, color, x, y, z, parent, o) => add(roundedGeo(w, h, d, r), color, x, y, z, parent, o);
      const latheGeo = (pts, seg = 72) => new THREE.LatheGeometry(pts.map((p) => new THREE.Vector2(p[0], p[1])), seg);
      const lathe = (pts, color, x, y, z, parent, o) => add(latheGeo(pts), color, x, y, z, parent, o);
      const tube = (pts, r, color, parent, o = {}) => add(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts.map((p) => V3(...p))), o.seg || 64, r, o.rad || 16, false), color, 0, 0, 0, parent, o);
      const painters = [];
      function paintTex(w, h, draw) {
        const c = document.createElement("canvas");

          const grow = (items, a, b, t) => items.forEach((it) => {
            const k = pop(t, a + it.at * (b - a), 0.5);
            it.m.visible = k > 0.001;
            it.m.scale.set(it.w, Math.max(0.001, it.h * k), it.w);
            it.m.position.y = (it === items[0] ? 0 : 0) + it.m.userData.base + (it.h * k) / 2;
          });
          brCluster.forEach((it) => (it.m.userData.base = 0.075));
          clCluster.forEach((it) => (it.m.userData.base = 0.1));
          grow(brCluster, 0.2, 1.6, t);
          grow(clCluster, 0.9, 2.2, t);
          brGlow.material.opacity = 0.55 * clamp(prog(t, 0.4, 1.6));
          clGlow.material.opacity = 0.6 * clamp(prog(t, 1.0, 2.2));
          const kb = pop(t, 1.0, 0.5), kc = pop(t, 1.48, 0.5);
          lbBr.position.set(spX - 0.35, 0.45, spZ + 0.45); sizePx(lbBr, 72 * kb); lbBr.visible = kb > 0.01;
          lbCl.position.set(stX + 0.62, 0.5, stZ - 0.05); sizePx(lbCl, 72 * kc); lbCl.visible = kc > 0.01;
        }
        if (shot.id === "rm" || shot.id === "rm2") {
          const n = shot.id === "rm" ? 37 * eOut(prog(t, 5.18, 6.6)) : 37;
          dcs.forEach((d, i) => {
            const k = shot.id === "rm" ? pop(t, 5.18 + (i / 37) * 1.42, 0.45) : 1;
            d.m.visible = i < Math.ceil(n) && k > 0.001;
            const dim = shot.id === "rm2" ? 0.6 : 1;
            d.m.scale.set(d.w, Math.max(0.001, d.h * k * dim), d.w * 0.8);
            d.m.position.y = 0.14 + (d.h * k * dim) / 2;
          });
          dcGlow.material.opacity = shot.id === "rm" ? 0.45 * clamp(prog(t, 5.5, 7)) : 0.12;
          urban.material.opacity = 1;
          const [sx0, sz0] = rmCity("Santiago");
          const ks = shot.id === "rm" ? pop(t, 5.4, 0.5) * (1 - io(prog(t, 7.6, 8.0))) : 0;
          lbSt.visible = ks > 0.01; lbSt.position.set(sx0 + 0.3, 0.5, sz0 + 0.5); sizePx(lbSt, 58 * ks);
          if (shot.id === "rm") {
            showPin(pinQ, t, 8.42);
            const kq = pop(t, 8.42, 0.5);
            lbQ.visible = kq > 0.01; lbQ.position.set(qx - 0.05, 1.25, qz); sizePx(lbQ, 72 * kq);
            RM_PINS.forEach((p) => { p[0].g.visible = false; p[4].visible = false; });
            lbBM.visible = lbVG.visible = false;
          } else {
            pinQ.g.visible = false; lbQ.visible = false;
            RM_PINS.forEach(([p, at, , , lb]) => {
              showPin(p, t, at);
              const green = clamp(prog(t, 48.42 + (at - 44.4) * 0.1, 48.9 + (at - 44.4) * 0.1));
              p.headM.color.set("#e0574f").lerp(C("#5fb85a"), green);
              p.headM.emissive.copy(p.headM.color); p.headM.emissiveIntensity = 0.15 + 0.5 * green;
              p.ring.material.color.copy(p.headM.color); p.halo.material.color.copy(p.headM.color);
              p.halo.material.opacity *= 1 + green * 1.5;
              const kl = pop(t, at + 0.1, 0.5);
              lb.visible = kl > 0.01;
              lb.position.set(p.g.position.x, 1.35, p.g.position.z); sizePx(lb, (lb.userData.aspect > 3.5 ? 62 : 100) * kl);
            });
            const kbm = pop(t, 49.6, 0.5), kvg = pop(t, 50.2, 0.5);
            lbBM.visible = kbm > 0.01; lbBM.position.set(pinPA.g.position.x + 0.1, 0.3, pinPA.g.position.z + 0.95); sizePx(lbBM, 104 * kbm);
            lbVG.visible = kvg > 0.01; lbVG.position.set(pinLa.g.position.x - 1.0, 0.3, pinLa.g.position.z + 0.35); sizePx(lbVG, 104 * kvg);
          }
        }
        if (shot.id === "aq") {
          const stop = 28.3;
          const tt = Math.min(t, stop);
          const level = mix(1.0, 0.32, io(prog(tt, 21.0, 27.6)));
          waterBox.scale.y = level;
          waterBox.position.y = -2.62 + level / 2;
          const flowing = t < stop + 0.25 && t > 19.4;
          const fade = clamp(prog(t, 19.4, 20.2)) * (1 - clamp(prog(t, stop, stop + 0.3)));
          flow.forEach((f, i) => {
            const ph = ((t * 0.9 + i / flow.length) % 1);
            const yTop = -0.05, yBot = -2.3;
            f.position.y = mix(yBot, yTop, ph);
            f.visible = flowing;
            f.scale.setScalar(Math.max(0.001, fade * Math.sin(Math.PI * ph) * 1.2));
          });
          chillers.forEach((ch, i) => (ch.blades.rotation.y = t * (6 + i)));
          steam.forEach((s, i) => {
            const ph = ((t * 0.35 + i / steam.length) % 1);
            const ch = chillers[i % chillers.length];
            s.position.set(dc.position.x + ch.x + Math.sin(i * 3 + t) * 0.06, 0.95 + ph * 1.3, dc.position.z);
            const sz = 0.25 + ph * 0.6;
            s.scale.set(sz, sz, 1);
            s.material.opacity = 0.35 * Math.sin(Math.PI * ph) * clamp(prog(t, 25.6, 26.4));
          });
          const kv = pop(t, stop, 0.5);
          valve.visible = t >= stop - 0.01;
          valve.scale.setScalar(Math.max(0.001, kv * 1.0));
          lock.rotation.z = Math.sin((t - stop) * 9) * 0.3 * Math.exp(-Math.max(0, t - stop) * 3);
          const kd = pop(t, 19.6, 0.5);
          lbDC.visible = kd > 0.01 && t < 20.85; lbDC.position.set(dc.position.x, 1.3, dc.position.z); sizePx(lbDC, 104 * kd * (1 - io(prog(t, 20.45, 20.85))));
        }
        if (shot.id === "tank") {
          const kn = io(prog(t, 37.3, 38.1));
          const hop = Math.sin(Math.PI * kn) * 0.55;
          knight.position.set(mix(0.15, -0.9, kn), 0.0 + hop, mix(1.05, 0.55, kn));
          knight.rotation.y = mix(0.5, 0.15, kn);
          const land = Math.exp(-Math.max(0, t - 38.1) * 8) * (t > 38.1 ? 1 : 0);
          knight.scale.set(0.85 * (1 + 0.08 * land), 0.85 * (1 - 0.1 * land), 0.85 * (1 + 0.08 * land));
          const k = eOut(prog(t, 42.24, 43.15));
          const capH = (TK.h * mix(80, 1000, k)) / 1000;
          limit.position.y = 0.1 + capH;
          limGlow.position.y = 0.1 + capH;
          limGlow.material.opacity = 0.5 + 0.3 * Math.sin(t * 6);
          const fillH = (TK.h * mix(80, 1000, eOut(prog(t, 42.35, 43.6)))) / 1000 - 0.02;
          fuel.scale.y = Math.max(0.01, fillH);
          fuel.position.y = 0.1 + fillH / 2;
          lb80.position.set(TK.x + TK.r + 0.42, 0.1 + (TK.h * 80) / 1000 + 0.12, TK.z); sizePx(lb80, 66 * pop(t, 40.3, 0.5)); lb80.visible = t > 40.3;
          lb1000.position.set(TK.x - TK.r - 0.5, 0.1 + TK.h, TK.z); sizePx(lb1000, 72 * pop(t, 42.9, 0.5)); lb1000.visible = t > 42.9;
        }
        if (shot.id === "mesa") {
          const fast = clamp(prog(t, 54.6, 55.2));
          minH.rotation.z = -(t - 51.75) * mix(0.5, 14, fast);
          hourH.rotation.z = -(t - 51.75) * mix(0.04, 1.2, fast);
          papers.forEach((p, i) => {
            const ph = ((t - 54.6) * 0.9 + i / papers.length) % 1;
            const on = t > 54.6 && t < 57.0;
            p.visible = on;
            p.position.set(mix(-1.4, 1.4, ph), 0.84 + Math.sin(Math.PI * ph) * 0.25, 0.1 + (i % 2) * 0.12);
            p.rotation.y = ph * 2.5;
          });
          // Foco: el resto se oscurece y queda iluminada la silla de Medio Ambiente.
          const f = io(prog(t, 55.9, 56.8));
          hemi.intensity = mix(shot.hi, 0.18, f);
          sunLight.intensity = mix(shot.si, 0.45, f);
          spot.position.set(3.0, 5.2, 3.4); spot.target.position.set(3.3, 0.5, 1.5); spot.angle = 0.3;
          spot.intensity = 42 * f;
          sign.rotation.z = Math.sin(t * 2.2) * 0.08 * clamp(prog(t, 56, 57));
        }
        if (shot.ov) updateOverlay(t);
      }

      const hide = (...os) => os.forEach((o) => (o.visible = false));
      function updateOverlay(t) {
        hide(cloud, drop1, drop2, drop3, bolt, boltGlow, ac, stack, spk, cake, vPlate, lbVec, ...drips, ...waves, ...smoke, ...drums.map((d) => d.g), ...TILES.map((x) => x.g));
        const bob = (o, i) => { o.position.y += Math.sin(t * 1.4 + i) * 0.03; o.rotation.y = Math.sin(t * 0.7 + i) * 0.25; };
        // Toma 1: nube con etiqueta de precio; luego gota y rayo junto a la cabeza.
        if (t < 18.5) {
          floatIn(cloud, t, 9.45, 14.15);
          cloud.position.copy(scr(540, 300, 0)); cloud.position.y += Math.sin(t * 1.1) * 0.03;
          cloud.rotation.y = Math.sin(t * 0.5) * 0.12;
          const kt = pop(t, 11.28, 0.7);
          tag.visible = t >= 11.28;
          tag.scale.setScalar(Math.max(0.001, kt));
          tag.rotation.z = Math.sin((t - 11.28) * 3.2) * 0.35 * Math.exp(-Math.max(0, t - 11.28) * 0.8) + Math.sin(t * 1.3) * 0.04;
          floatIn(drop1, t, 15.88, 18.15, 1);
          drop1.position.copy(scr(185, 640)); bob(drop1, 0);
          floatIn(bolt, t, 16.2, 18.15, 0.95);
          bolt.position.copy(scr(895, 640)); bolt.rotation.set(0, Math.sin(t * 0.8) * 0.3, -0.12); bolt.position.y += Math.sin(t * 1.3 + 1) * 0.03;
          boltGlow.visible = bolt.visible; boltGlow.position.copy(bolt.position).add(V3(0, 0, -0.2));
          boltGlow.material.opacity = bolt.visible ? 0.16 * bolt.scale.x : 0;
        } else if (t < 36.3) {
          // Toma 2: la gota se cambia por un aire acondicionado; caen tambores de diésel.
          floatIn(drop2, t, 30.5, 31.25, 1);
          drop2.position.copy(scr(190, 640)); bob(drop2, 1);
          const ka = floatIn(ac, t, 31.42, 35.95, 1);
          ac.position.copy(scr(190, 650)); ac.rotation.set(0.05, 0.35 + Math.sin(t * 0.6) * 0.1, 0); ac.position.y += Math.sin(t * 1.2) * 0.025;
          acFan.rotation.z = -t * 14;
          drums.forEach((d) => {
            const at = 33.74 + d.i * 0.13;
            const fall = clamp(prog(t, at, at + 0.38));
            const y0 = scr(0, 860).y + d.row * 0.4;
            d.g.visible = t >= at && t < 36.27;
            const b = settle(fall);
            d.g.position.set(scr(870, 0).x + d.x, mix(y0 + 2.2, y0, eIn(fall)) + (fall >= 1 ? 0 : 0), 0);
            if (fall >= 1) d.g.position.y = y0 + Math.max(0, (1 - b)) * 0.03;
            const e = io(prog(t, 35.95, 36.27));
            d.g.scale.setScalar(Math.max(0.001, 1 - e));
            d.g.rotation.y = d.i * 0.7;
          });
        } else if (t >= 59.75) {
          // Toma 3: contaminar (humo), gastar agua (gota que gotea), ruido (parlante); torta y platos rotos; fichas.
          const e3 = 65.1;
          floatIn(stack, t, 62.3, e3, 1);
          stack.position.copy(scr(185, 700));
          smoke.forEach((s, i) => {
            const ph = ((t * 0.5 + i / smoke.length) % 1);
            s.visible = stack.visible;
            s.position.copy(scr(185, 700)).add(V3(Math.sin(i * 2.1 + t * 0.8) * 0.06 + ph * 0.35, 0.4 + ph * 0.9, 0));
            const sz = (0.14 + ph * 0.42) * stack.scale.x;
            s.scale.set(sz, sz, 1);
            s.material.opacity = 0.75 * Math.sin(Math.PI * ph) * clamp(stack.scale.x);
          });
          floatIn(drop3, t, 63.18, e3, 1);
          drop3.position.copy(scr(895, 560)); bob(drop3, 2);
          drips.forEach((d, i) => {
            const ph = ((t * 0.8 + i / 3) % 1);
            d.visible = drop3.visible;
            d.position.copy(drop3.position).add(V3(0, -0.4 - ph * 0.9, 0));
            d.scale.setScalar(Math.max(0.001, drop3.scale.x * (1 - ph)));
          });
          floatIn(spk, t, 63.98, e3, 1);
          spk.position.copy(scr(895, 900)); spk.rotation.y = -0.35 + Math.sin(t * 0.7) * 0.1;
          spk.position.x += Math.sin(t * 40) * 0.006 * spk.scale.x;
          waves.forEach((w, i) => {
            const ph = ((t * 1.3 + i / 3) % 1);
            w.visible = spk.visible;
            w.position.copy(spk.position).add(V3(-0.3 - ph * 0.15, 0, 0.1));
            w.rotation.set(0, 0, Math.PI * 0.7);
            w.scale.setScalar(0.5 + ph * 0.9);
            w.material.opacity = 0.8 * (1 - ph) * clamp(spk.scale.x);
          });
          // La torta: los vecinos se quedan con el plato vacío.
          const kc = floatIn(cake, t, 65.4, 72.0, 1);
          cake.position.copy(scr(640, 330)); cake.rotation.set(0.42, Math.sin(t * 0.5) * 0.2, 0);
          slices.forEach((s, i) => {
            const at = 66.74 + i * 0.24;
            const f = io(prog(t, at, at + 0.7));
            s.g.visible = f < 1;
            s.g.position.set(Math.sin(s.th) * f * 0.5 + f * 2.4, f * 0.6, Math.cos(s.th) * f * 0.3);
            s.g.rotation.z = -f * 1.2;
          });
          const kv = floatIn(vPlate, t, 65.98, 72.4, 1);
          vPlate.position.copy(scr(250, 360)); vPlate.rotation.set(0.5, 0, 0);
          const br = prog(t, 71.5, 72.4);
          shards.forEach((s, i) => {
            const a = (i / 6) * Math.PI * 2 + Math.PI / 6;
            const f = br;
            s.position.set(Math.sin(a) * f * 0.35, -4.9 * f * f * 0.9 + Math.cos(a) * f * 0.2, Math.cos(a) * f * 0.25);
            s.rotation.set(f * (2 + i), f * i, f * (1.5 - i * 0.4));
          });
          if (br > 0) vPlate.scale.setScalar(1);
          vPlate.visible = t >= 65.98 && br < 1;
          lbVec.visible = vPlate.visible && t < 71.5;
          lbVec.position.copy(scr(250, 455)); sizePx(lbVec, 62 * kv.k * (1 - kv.e));
          // Fichas que se juntan
          TILES.forEach((tl, i) => {
            const k = pop(t, tl.at, 0.6);
            const ex = io(prog(t, 81.2, 81.55));
            tl.g.visible = t >= tl.at && ex < 1;
            const start = [scr(230, 330), scr(850, 330), scr(540, 470), scr(540, 470)][i];
            const row = [scr(230, 300), scr(540, 300), scr(850, 300), scr(540, 440)][i];
            const grid = [scr(390, 285), scr(690, 285), scr(390, 410), scr(690, 410)][i];
            const j1 = io(prog(t, 77.6, 78.3)), j2 = io(prog(t, 80.66, 81.1));
            const p = start.clone().lerp(row, j1).lerp(grid, j2);
            tl.g.position.copy(p);
            tl.g.position.y += Math.sin(t * 1.4 + i) * 0.02 * (1 - j1);
            const snap = Math.exp(-Math.max(0, t - 78.3) * 7) * (t > 78.3 ? 1 : 0);
            tl.g.scale.setScalar(Math.max(0.001, k * (1 - ex) * (0.88 + 0.08 * snap)));
            tl.g.rotation.set(0, Math.sin(t * 0.8 + i) * 0.15 * (1 - j1), 0);
          });
        }
      }

      /* ---------- CUADRO FINAL ---------- */
      const SUBS = 6, SHUTTER = 1 / 120;
      const grainEl = el("w-grain");
      const grctx = grainEl.getContext("2d");
      const grImg = grctx.createImageData(540, 960);
      function drawGrain(t) {
        const r = rng(Math.round(t * 60) + 7);
        const d = grImg.data;
        for (let i = 0; i < d.length; i += 4) { const g = r() * 255; d[i] = d[i + 1] = d[i + 2] = g; d[i + 3] = 255; }
        grctx.putImageData(grImg, 0, 0);
      }
      const fmt = (v) => v.toLocaleString("es-CL");
      const n37 = el("n-37"), n169 = el("n-169"), n696 = el("n-696"), nTope = el("n-tope");
      function updateHtml(t) {
        n37.textContent = fmt(Math.round(37 * eOut(prog(t, 5.18, 6.6))));
        n169.textContent = fmt(Math.round(169 * eOut(prog(t, 20.9, 22.2))));
        n696.textContent = fmt(Math.round(696 * eOut(prog(t, 34.26, 35.4))));
        nTope.textContent = fmt(Math.round(80 + 920 * eOut(prog(t, 42.24, 43.15))));
      }
      function renderAt(t) {
        t = clamp(t, 0, DUR - 1 / 120);
        let si = SHOTS.findIndex((s) => t >= s.a && t < s.b);
        if (si < 0) si = SHOTS.length - 1;
        const shot = SHOTS[si];
        outCtx.globalCompositeOperation = "source-over";
        outCtx.globalAlpha = 1;
        outCtx.clearRect(0, 0, canvas.width, canvas.height);
        for (let k = SUBS - 1; k >= 0; k--) {
          const tk = Math.max(shot.a, t - (k / (SUBS - 1)) * SHUTTER);
          updateScene(tk, shot);
          renderer.render(scene, camera);
          outCtx.globalAlpha = 1 / (SUBS - k);
          outCtx.drawImage(glCanvas, 0, 0);
        }
        outCtx.globalAlpha = 1;
        drawGrain(t);
        updateHtml(t);
        scrimEl.style.opacity = shot.ov ? "0" : "1";
        let blur = 0;
        for (const cut of BLUR_CUTS) {
          if (t >= cut - 0.26 && t < cut) blur = Math.max(blur, 26 * eIn(prog(t, cut - 0.26, cut)));
          if (t >= cut && t < cut + 0.42) blur = Math.max(blur, 26 * (1 - eOut(prog(t, cut, cut + 0.42))));
        }
        canvas.style.filter = blur > 0.05 ? "blur(" + blur.toFixed(2) + "px)" : "none";
        canvas.style.transform = blur > 0.05 ? "scale(" + (1 + blur * 0.004).toFixed(4) + ")" : "none";
        bctx.clearRect(0, 0, 270, 480);
        bctx.globalCompositeOperation = "source-over";
        bctx.drawImage(canvas, 0, 0, 270, 480);
        bctx.globalCompositeOperation = "multiply";
        bctx.drawImage(canvas, 0, 0, 270, 480);
        bctx.drawImage(canvas, 0, 0, 270, 480);
        bloomEl.style.filter = "blur(" + (16 + blur).toFixed(1) + "px)";
        bloomEl.style.opacity = shot.ov ? "0.25" : "0.45";
      }

      // Todo texto entra y sale con Fade In y Fade Out.
      const tl = gsap.timeline({ paused: true });
      [["#c-rank", 1.4, 4.8], ["#c-37", 5.18, 8.73], ["#t-srca", 1.4, 8.7], ["#c-agua", 14.64, 18.39], ["#c-169", 20.9, 27.0], ["#c-trib", 27.18, 28.98],
       ["#t-srcb", 19.3, 28.95], ["#c-aire", 31.2, 34.1], ["#c-696", 34.26, 36.21], ["#t-srcc", 31.2, 36.2], ["#c-ds17", 38.68, 41.98], ["#c-tope", 42.1, 43.75],
       ["#t-srcd", 38.7, 43.75], ["#c-seis", 44.2, 48.3], ["#c-pert", 48.42, 51.62], ["#t-srce", 44.2, 51.6], ["#c-mesa", 52.88, 55.73], ["#c-mma", 55.8, 59.1],
       ["#t-srcf", 52.9, 59.1], ["#c-q", 72.52, 75.12]].forEach(([sel, at, end]) => {
        tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "sine.inOut" }, at);
        tl.to(sel, { opacity: 0, duration: 0.28, ease: "sine.inOut" }, end - 0.29);
      });
      tl.fromTo("#s-inv", { opacity: 0, scale: 1.45 }, { opacity: 0.95, scale: 1, duration: 0.2, ease: "power3.in" }, 58.7 - 0.2);
      tl.to("#s-inv", { opacity: 0, duration: 0.22, ease: "sine.inOut" }, 58.96);
      tl.fromTo("#w-end", { opacity: 0 }, { opacity: 1, duration: 0.9, ease: "sine.inOut" }, 81.6);
      tl.set({}, {}, 82.8);
      window.__timelines["world"] = tl;

      if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { painters.forEach((p) => p()); });
      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      renderAt(0);
    })();
  </script>
</template>
