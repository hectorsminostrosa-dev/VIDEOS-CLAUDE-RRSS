          deskCan.g.rotation.set(0, mix(-0.9, 0, eOut(prog(t, 0, 1.2))) + (shot.id === "swap" ? (t - 5.85) * 0.22 : 0), mix(0.16, 0, eOut(fall)));
          deskCan.g.scale.setScalar(mix(1, 1.12, sl));
          // El golpe hace saltar la taza y el plato.

          bfMug.position.y = jolt; bfPlate.position.y = jolt * 0.8;
          // "Sustituir el desayuno": la taza y el pan se vuelven malla de alambre y se evaporan.
          const ev = io(prog(t, 6.2, 7.7));
          bfast.visible = ev < 1;
          bfast.position.y = ev * 0.9;
          bfMats.forEach((o) => {
            o.material.opacity = 1 - ev;
            o.material.wireframe = ev > 0.1;
            o.material.emissive.set("#CA3390"); o.material.emissiveIntensity = ev > 0.1 ? 1.2 : 0;
            o.castShadow = ev < 0.1;
          });
          bfSteam(t, 1 - prog(t, 6.0, 6.4));
          // "Ojo al dato": anillo y brillo alrededor de la lata.
          const oj = prog(t, 9.37, 10.5);
          deskRing.scale.setScalar(1 + oj * 1.1);
          deskRing.material.opacity = 0;
          deskGlow.material.opacity = 0.16 + 0.3 * io(prog(t, 6.2, 7.6)) + 0.25 * Math.sin(Math.PI * oj);

        }

        if (shot.set === gaugeSet) {
          // La aguja sube con el contador hasta el máximo (505 mg) y pasa la marca del límite.
          const k = eOut(prog(t, 13.3, 14.5));
          mgK = k;
          const pre = 0.07 * io(prog(t, 10.9, 13.3));
          const over = io(prog(t, 16.1, 16.7));
          const v = pre * (1 - k) + k * (1 + 0.012 * Math.sin(t * 46));
          needle.rotation.z = gAng(v) - Math.PI / 2;
          gCan.g.rotation.y = (t - 10.66) * 0.5;
          shakeCan(gCan, t, 0.012 * k);
          const pulse = 0.5 + 0.5 * Math.sin((t - 16.1) * 9);
          gRing.material.emissiveIntensity = over * (0.6 + 0.8 * pulse);
          gGlow.material.opacity = over * (0.2 + 0.2 * pulse);
          // Chispas de cafeína que suben de la lata al medidor.

          sparks.forEach((s, i) => {

            const d = t - N2.at;

          // Vertido: la lata se inclina, cae el chorro y el nivel sube.

          hammer.rotation.z = 0.5 + Math.sin(t * 150) * 0.22 * ring;

            const ph = ((t - 63.54) * 1.6 + i / 3) % 1;
            r.scale.setScalar(1 + ph * 1.3);
            r.material.opacity = ring * (1 - ph) * 0.7;
          });

        }

        if (shot.set === abuSet) {
          // Aparecen de a uno: café, pancito con huevo y agüita de hierbas. Al final, la lata se cae y sale rodando.
          [[aCoffee, 65.3, 0.82], [aBread, 66.4, 1], [aTea, 68.5, 1]].forEach(([o, at, s0], i) => {
            const k = settle(prog(t, at, at + 0.6));
            o.visible = t >= at;
            o.scale.setScalar(Math.max(0.001, s0 * k));
            o.rotation.y = (1 - Math.min(1, prog(t, at, at + 0.6))) * -1.2 + (i === 2 ? -0.3 : 0);
          });
          aSteam1(t, prog(t, 65.7, 66.3));
          aSteam2(t, prog(t, 68.9, 69.5));
          const fk = prog(t, 70.96, 71.5);
          const roll = prog(t, 71.3, 72.6);
          aCan.g.rotation.x = -(Math.PI / 2) * eIn(fk);
          aCan.g.position.set(1.3 + 3.4 * roll * roll, 0.33 * eIn(fk), -2.0);
          aCan.inner.rotation.y = roll * 9;
          abuGlow.material.opacity = 0.16 + 0.04 * Math.sin(t * 1.5);
        }
      }

      // Motion blur real: 6 muestras dentro de un obturador de 180° a 60 fps (1/120 s), promediadas.
      // Nunca mezcla dos tomas: las muestras no retroceden antes del inicio de la toma actual.
      const SUBS = 6, SHUTTER = 1 / 120;
      const grainEl = document.getElementById("w-grain");
      const grctx = grainEl.getContext("2d");
      const grImg = grctx.createImageData(540, 960);
      function drawGrain(t) {
        const r = rng(Math.round(t * 60) + 7);
        const d = grImg.data;
        for (let i = 0; i < d.length; i += 4) { const g = r() * 255; d[i] = d[i + 1] = d[i + 2] = g; d[i + 3] = 255; }
        grctx.putImageData(grImg, 0, 0);
      }
      const el = (id) => document.getElementById(id);
      const nMg = el("n-mg");
      function updateHtml(t) { nMg.textContent = String(Math.round(505 * mgK)); }
      function renderAt(t) {
        t = clamp(t, 0, DUR - 1 / 120);
        let si = SHOTS.findIndex((s) => t >= s.a && t < s.b);
        if (si < 0) si = SHOTS.length - 1;
        const shot = SHOTS[si];
        outCtx.globalCompositeOperation = "source-over";
        for (let k = SUBS - 1; k >= 0; k--) {
          const tk = Math.max(shot.a, t - (k / (SUBS - 1)) * SHUTTER);
          updateScene(tk, shot, si);
          renderer.render(scene, camera);
          outCtx.globalAlpha = 1 / (SUBS - k);
          outCtx.drawImage(glCanvas, 0, 0);
        }
        outCtx.globalAlpha = 1;
        drawGrain(t);
        updateHtml(t);
        let blur = 0;
        for (const cut of BLUR_CUTS) {
          if (t >= cut - 0.26 && t < cut) blur = Math.max(blur, 26 * eIn(prog(t, cut - 0.26, cut)));
          if (t >= cut && t < cut + 0.42) blur = Math.max(blur, 26 * (1 - eOut(prog(t, cut, cut + 0.42))));
        }
        canvas.style.filter = blur > 0.05 ? "blur(" + blur.toFixed(2) + "px)" : "none";
        canvas.style.transform = blur > 0.05 ? "scale(" + (1 + blur * 0.004).toFixed(4) + ")" : "none";
        bctx.globalCompositeOperation = "source-over";
        bctx.drawImage(canvas, 0, 0, 270, 480);
        bctx.globalCompositeOperation = "multiply";
        bctx.drawImage(canvas, 0, 0, 270, 480);
        bctx.drawImage(canvas, 0, 0, 270, 480);
        bloomEl.style.filter = "blur(" + (16 + blur).toFixed(1) + "px)";
        let sw = 0;
        for (const cut of BLUR_CUTS) if (t >= cut - 0.2 && t < cut + 0.2) sw = prog(t, cut - 0.2, cut + 0.2);
        sweepEl.style.opacity = sw > 0 ? String(Math.sin(Math.PI * sw)) : "0";
        sweepEl.style.transform = "translateY(" + (sw * 1920).toFixed(1) + "px)";
        let fl = 0;
        // Destello que se apaga del todo (llega a 0 justo al final de su ventana, sin escalón).
        for (const cut of FLASH_CUTS) if (t >= cut && t < cut + 0.6) fl = Math.max(fl, 0.75 * (Math.exp(-(t - cut) * 9) - Math.exp(-5.4)) / (1 - Math.exp(-5.4)));
        flashEl.style.opacity = fl.toFixed(3);
      }

      // Todo texto entra y sale con Fade In y Fade Out.
      const tl = gsap.timeline({ paused: true });
      [["#c-desay", 6.2, 9.3], ["#t-src1", 10.9, 19.9], ["#c-505", 13.3, 19.9], ["#c-lim", 16.3, 19.9], ["#t-cred", 39.6, 40.87],
       ["#t-src2", 41.0, 44.7], ["#c-ley", 42.0, 44.72], ["#c-que", 45.58, 48.26], ["#c-ing", 46.2, 48.26], ["#c-arr", 48.76, 52.85],
       ["#c-abu", 68.6, 71.95]].forEach(([sel, at, end]) => {
        tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "sine.inOut" }, at);
        tl.to(sel, { opacity: 0, duration: 0.28, ease: "sine.inOut" }, end - 0.29);
      });
      // Sellos: se estampan con un golpe breve, también con fundido.
      [["#s-bd", 33.66, 36.2], ["#s-ley", 41.75, 44.72]].forEach(([sel, at, end]) => {
        tl.fromTo(sel, { opacity: 0, scale: 1.45 }, { opacity: 0.94, scale: 1, duration: 0.2, ease: "power3.in" }, at - 0.2);
        tl.to(sel, { opacity: 0, duration: 0.28, ease: "sine.inOut" }, end - 0.29);
      });
      // Notas a mano: se escriben de izquierda a derecha y se desvanecen.
      [["#n-hora", 56.44, 57.92], ["#n-ring", 63.6, 64.68]].forEach(([sel, at, end]) => {
        tl.fromTo(sel, { clipPath: "inset(-30% 100% -30% -5%)", opacity: 0 }, { clipPath: "inset(-30% -5% -30% -5%)", opacity: 1, duration: 0.4, ease: "sine.inOut" }, at);
        tl.to(sel, { opacity: 0, duration: 0.25, ease: "sine.inOut" }, end - 0.26);
      });
      tl.fromTo("#e-bg", { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "sine.inOut" }, 72.0);
      tl.fromTo("#e-txt", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "sine.inOut" }, 72.45);
      tl.to("#e-txt", { opacity: 0, duration: 0.3, ease: "sine.inOut" }, 74.65);
      tl.set({}, {}, 75);
      window.__timelines["world"] = tl;
      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      renderAt(0);
    })();
  </script>
</template>
