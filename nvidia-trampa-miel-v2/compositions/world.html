              s.m.rotation.set(s.w[0] * dt, s.w[1] * dt, s.w[2] * dt);
            } else {
              // En el suelo: queda acostado y se desliza un poco antes de detenerse.
              const slide = 0.25 * (1 - Math.exp(-(dt - tLand) * 4));
              s.m.position.set(s.cx + s.v[0] * (tLand + slide), floorY, s.v[2] * (tLand + slide));
              s.m.rotation.set(Math.PI / 2, 0, s.w[2] * tLand);
            }
          });
        }

        if (shot.id === "folder") {
          spot.intensity = 9; spot.color.set(0xffe3b8); spot.angle = 0.6; spot.penumbra = 0.7;
          spot.position.set(-2.5, 6.5, 2.0); spot.target.position.set(0, 0, 0); spot.target.updateMatrixWorld();
          // Timbre: baja, estampa "INVESTIGACIÓN" y sube.
          const inK = io(prog(t, 16.6, 17.08)), down = io(prog(t, 17.1, 17.38)), up = io(prog(t, 17.62, 18.1));
          stampTool.visible = t > 16.6 && t < 18.1;
          stampTool.position.set(mix(2.8, 0.15, inK) + 2.8 * up, 0.09 + 0.75 * (1 - down) + 0.9 * up, 0.95);
          stampTool.rotation.y = 0.1;
          invMark.visible = t >= 17.4;
          invMark.material.opacity = clamp((t - 17.4) / 0.05);
          // La tapa se abre sola en "destaparse".
          const op = settle(prog(t, 18.28, 19.2));
          coverPivot.rotation.z = (Math.PI - 0.05) * Math.min(1, op) + 0.03 * Math.max(0, op - 1);
          pointB.intensity = 0;
        }

        if (shot.id === "globe") {
          // Vista: del Pacífico (Santa Clara y Singapur) a Asia (Singapur, Malasia y Beijing).
          const v1 = io(prog(t, 25.26, 27.6)), v2 = io(prog(t, 27.6, 30.6));
          // Longitudes "desenrolladas" para girar por el camino corto (158° E = −202°, 112° E = −248°).
          const lon = mix(mix(-178, -202, v1), -248, v2);
          const lat = mix(mix(16, 18, v1), 16, v2);
          globeSpin.rotation.y = -lon * D2R;
          globeTilt.rotation.x = lat * D2R;
          globeTilt.updateMatrixWorld(true);
          ARCS.forEach((A, ai) => {
            const k = io(prog(t, A.a, A.b));
            A.pieces.forEach((P) => {
              const vis = clamp((k - P.s0) * (A.dash ? 28 : 1));
              P.m.visible = vis > 0;
              P.m.geometry.setDrawRange(0, Math.max(1, Math.floor(vis * P.n)) * 48);
            });
            A.chips.forEach((ch) => {
              const span = 2.2;
              const u = (t - A.b + 0.3 - ch.k * (span / 3)) / span;
              const uu = ((u % 1) + 1) % 1;
              ch.cg.visible = t > A.b - 0.2;
              const p = A.c.getPointAt(uu), q = A.c.getPointAt(Math.min(1, uu + 0.01));
              ch.cg.position.copy(p);
              ch.cg.lookAt(globeSpin.localToWorld(q.clone()));
              ch.cg.scale.setScalar(Math.sin(Math.PI * uu) > 0.1 ? 1 : Math.sin(Math.PI * uu) * 10);
            });
          });
          const pulse = 0.5 + 0.5 * Math.sin(t * 6);
          PINS.bj.gl.material.opacity = 0.5 + 0.5 * pulse * prog(t, 28.5, 29);
          const camPos = camera.position.clone();
          LABELS.forEach((L) => {
            const p = ll(L.city[0], L.city[1], R * 1.02);
            const wp = globeSpin.localToWorld(p.clone());
            const facing = wp.clone().normalize().dot(camPos.clone().normalize());
            const k = eOut(prog(t, L.a, L.a + 0.35)) * clamp((facing - 0.15) / 0.2);
            L.sp.visible = k > 0.01;
            L.sp.material.opacity = k;
            // Desplazamiento en pantalla (ejes de la cámara), para que no tape el punto.
            const right = V3(1, 0, 0).applyQuaternion(camera.quaternion), upv = V3(0, 1, 0).applyQuaternion(camera.quaternion);
            const dist = camera.position.distanceTo(wp);
            const off = wp.clone().addScaledVector(right, L.dx * dist / 8).addScaledVector(upv, L.dy * dist / 8);
            L.sp.position.copy(globeSpin.worldToLocal(off));
            const sc = 1.25 * dist / 8;
            L.sp.scale.set(sc, sc * L.sp.userData.aspect, 1);
          });
          // Mira roja sobre un chip en tránsito hacia Beijing
          const tgt = ARCS[1].chips[0].cg;
          const wpos = new THREE.Vector3();
          tgt.getWorldPosition(wpos);
          const rk = settle(prog(t, 30.34, 30.8));
          reticle.visible = t >= 30.34;
          reticle.position.copy(wpos);
          const rs = 0.75 * mix(2.2, 1, rk);
          reticle.scale.set(rs, rs, 1);
          reticle.material.rotation = (1 - rk) * 1.2;
          reticle.material.opacity = clamp(rk * 1.4);
          atmo.material.opacity = 0.2;
        }

        if (shot.id === "email") {
          drawEmail(io(prog(t, 37.1, 37.75)), t >= 35.94);
          const k = settle(prog(t, 33.92, 34.7));
          mail.rotation.set(mix(0.25, 0, k) + Math.sin(t * 0.7) * 0.02, mix(-0.7, -0.08, k) + Math.sin(t * 0.5) * 0.03, 0);
          mail.position.set(0, 1.2 + Math.sin(t * 1.1) * 0.03, mix(-1.2, 0, k));
          ENVS.forEach((E) => { E.g.position.set(E.x + Math.sin(t * 0.6 + E.i) * 0.08, E.y + Math.sin(t * 0.9 + E.i * 2) * 0.12, E.z); E.g.rotation.z = E.rz + Math.sin(t * 0.7 + E.i) * 0.1; });
          const ping = prog(t, 35.94, 36.5);
          mailGlow.material.opacity = 0.25 + 0.35 * Math.sin(Math.PI * ping);
        }

        if (shot.id === "market") {
          candles.forEach((cd) => {
            let o = cd.o, cl = cd.c;
            const appear = cd.i < 11 ? 1 : eOut(prog(t, 41.0 + (cd.i - 11) * 0.28, 41.3 + (cd.i - 11) * 0.28));
            if (cd.i === 13) cl = mix(cd.o, cd.c, eIn(prog(t, 41.65, 42.2)));
            const y0 = pY(Math.min(o, cl)), y1 = pY(Math.max(o, cl));
            let lo = cd.i === 13 && t >= 42.2 ? 0.0 : y0;
            if (cd.i === 13) lo = mix(y0, 0, eIn(prog(t, 41.9, 42.2)));
            const hgt = Math.max(0.03, y1 - lo);
            cd.g.visible = appear > 0.01;
            cd.body.scale.set(1, hgt, 1);
            cd.body.position.y = lo + hgt / 2;
            cd.wick.scale.set(1, hgt + 0.18, 1);
            cd.wick.position.y = lo + hgt / 2;
            cd.g.scale.setScalar(Math.max(0.001, appear));
          });
          const dk = prog(t, 42.2, 42.46);
          dust.forEach((s, i) => {
            const a = (i / 6) * Math.PI * 2;
            s.visible = t >= 42.2;
            s.position.set(CX(13) + Math.cos(a) * 0.35 * eOut(dk), 0.12 + 0.2 * dk, -0.9 + Math.sin(a) * 0.25 * eOut(dk));
            s.scale.setScalar(0.3 + 0.5 * dk);
            s.material.opacity = 0.5 * (1 - dk);
          });
          const v = mix(162.2, 155.4, eOut(prog(t, 41.06, 42.3)));
          drawFort(v);
          const H = BARH * (155.4 / 162.2);
          bar.scale.set(1, H, 1); bar.position.y = H / 2;
          const ch = BARH - H;
          const fk = eIn(prog(t, 41.4, 42.2));
          chunk.position.set(0.0 + 0.35 * fk, mix(H + ch / 2 + 0.005, ch / 2 + 0.01, fk), 0.25 * fk);
          chunk.rotation.z = -0.9 * fk;
          fortLabel.position.set(0, BARH + 0.3, 0.1);
          rimLight.color.set(0xe5484d);
        } else rimLight.color.set(0x76b900);

        if (shot.id === "audit") {
          const P = [
            [mix(-1.6, -1.4, 0.5 + 0.5 * Math.sin(t * 0.9)), 1.9 + 0.3 * Math.sin(t * 1.3), -0.95, 0.2],
            [1.5 + 0.12 * Math.sin(t * 1.1), 1.5 + 0.35 * Math.sin(t * 0.8 + 1), -1.05, -0.2],
            [-0.3 + 0.35 * Math.sin(t * 0.7), 1.45 + 0.05 * Math.sin(t * 2), 0.0, 0],
          ];
          lenses.slice(0, 3).forEach((L, i) => {
            const [x, y, z, ry] = P[i];
            L.position.set(x, y, z + 0.6);
            L.rotation.set(-0.35, ry, Math.sin(t + i) * 0.1);
          });
          // La tarjeta de débito entra y la lupa grande la "agranda".
          const dk = settle(prog(t, 45.6, 46.15));
          debit.visible = t >= 45.6;
          debit.position.set(mix(2.2, 0, dk), 1.25 + Math.sin(t * 1.4) * 0.02, 1.2);
          debit.rotation.set(-0.1, mix(-0.8, 0.05, dk), mix(-0.4, 0.04, dk));
          const lk = io(prog(t, 45.95, 46.45));
          const big = lenses[3];
          big.visible = t >= 45.8;
          big.position.set(mix(-1.8, 0.24, lk), 1.2, 1.5);
          big.rotation.set(0, 0, 0.5);
          debit.scale.setScalar(mix(1, 1.18, lk));
          racks.forEach((rk, i) => { rk.f.material.color.setScalar(0.75 + 0.25 * (Math.sin(t * 13 + i * 2) > 0 ? 1 : 0.6)); });
        }

        if (shot.id === "sofa") {
          pointB.color.set(0xffc890); pointB.intensity = 4; pointB.distance = 8; pointB.position.set(2.15, 1.25, -1.0);
          spot.intensity = 3.2; spot.color.set(0xfff0dc); spot.angle = 0.4; spot.penumbra = 0.8;
          spot.position.set(1.2, 3.6, 2.4); spot.target.position.set(0.5, 0.7, -0.55); spot.target.updateMatrixWorld();
          const fi = Math.max(0, Math.min(KC_N - 1, Math.floor((t - 48.0) * 24)));
          drawTV(fi);
          tvGlow.material.opacity = 0.14 + 0.05 * Math.sin(t * 5);
          flyChips.forEach((g, i) => {
            const t0 = 51.75 + i * 0.22;
            const k = prog(t, t0, t0 + 1.3);
            g.visible = t >= t0 && k < 1;
            jacketG.updateWorldMatrix(true, false);
            const sofaW = jacketG.localToWorld(pocket.clone());
            const dir = (i % 2 ? 1 : -1) * (0.3 + 0.12 * i);
            g.position.set(sofaW.x + dir * k * 1.2, sofaW.y + 2.6 * k - 1.4 * k * k + 0.05, sofaW.z + 0.5 * k);
            g.rotation.set(t * 6 + i, t * 4 + i, t * 5);
          });
        }

        if (shot.id === "wallet") {
          wallet.rotation.y = Math.sin(t * 0.6) * 0.08 - 0.1;
          smoke.forEach((s, i) => {
            const ph = ((t - 53.76) * 0.5 + i / 16) % 1;
            const r = rng(i * 13 + 1);
            const x0 = (r() - 0.5) * 0.7;
            s.position.set(x0 + Math.sin(t * 1.3 + i) * 0.12 * ph, 0.8 + ph * 1.7, 0.1 + (r() - 0.5) * 0.3);
            const sc = 0.22 + ph * 0.8;
            s.scale.set(sc, sc, 1);
            s.material.opacity = 0.3 * Math.sin(Math.PI * ph) * clamp((t - 53.8) / 0.4);
          });
          bills.forEach((B) => {
            const t0 = 55.45 + B.i * 0.28;
            const k = prog(t, t0, t0 + 2.4);
            B.g.visible = t >= t0 && k < 1;
            const r = rng(B.i * 7 + 3);
            const side = (B.i % 2 ? 1 : -1) * (0.3 + r() * 0.5);
            B.g.position.set(side * k * 1.4 + (r() - 0.5) * 0.3, 0.9 + k * 2.6, 0.1 + (r() - 0.5) * 0.4 + k * 0.5);
            B.g.rotation.set(0.2, side * 0.3, Math.sin(t * 3 + B.i) * 0.2);
            const flap = Math.sin(t * 16 + B.i) * 0.9;
            B.wl.rotation.y = flap; B.wr.rotation.y = -flap;
            B.g.scale.setScalar(0.7 * mix(0.6, 1, eOut(prog(t, t0, t0 + 0.4))));
          });
        }

        if (shot.id === "box") {
          // La caja cae, rebota y se abre; sube la tarjeta radiactiva; al final asoma el pato.
          const fall = prog(t, 57.5, 57.95);
          const land = settle(prog(t, 57.95, 58.6));
          parcel.position.y = t < 57.95 ? mix(4.2, 0, fall * fall) : 0;
          const sq = t < 57.95 ? 0 : (1 - land) * 0.25 * Math.exp(-(t - 57.95) * 4);
          boxInner.scale.set(1 + sq * 0.6, 1 - sq, 1 + sq * 0.6);
          const op = settle(prog(t, 59.98, 60.7));
          flaps.forEach((f, i) => {
            const a = mix(0, 2.1, Math.min(1.05, op)) + Math.sin(t * 3 + i) * 0.02 * op;
            if (f.ax === "x") f.piv.rotation.x = f.s * a; else f.piv.rotation.z = f.s * a;
          });
          const rise = settle(prog(t, 60.35, 61.3));
          gpu.visible = t >= 60.3;
          gpu.position.set(0, mix(0.3, 1.95, rise) + Math.sin(t * 1.5) * 0.04, 0.2);
          gpu.rotation.set(-0.12 + Math.sin(t * 0.8) * 0.03, mix(-1.2, 0, rise) + Math.sin((t - 61) * 0.7) * 0.25 * clamp(t - 61), 0);
          fans.forEach((f) => (f.rotation.z = -t * 18));
          const pulse = 0.5 + 0.5 * Math.sin(t * 7);
          radGlows.forEach((g, i) => (g.material.opacity = (0.35 + 0.35 * Math.sin(t * 7 + i)) * clamp((t - 60.6) / 0.4)));
          radM.emissiveIntensity = 1 + pulse;
          pointA.color.set(0x9dff2a); pointA.intensity = 4 * clamp((t - 60.6) / 0.4) * (0.7 + 0.3 * pulse); pointA.distance = 6;
          pointA.position.set(0, gpu.position.y + 0.2, 0.9);
          const pk = settle(prog(t, 63.72, 64.1));
          price.visible = t >= 63.72;
          price.scale.setScalar(Math.max(0.001, mix(1.8, 1, pk)));
          const dk = settle(prog(t, 67.3, 67.9));
          duck.visible = t >= 67.3;
          duck.position.set(0.3, mix(0.2, 1.15, dk), 0.3);
          duck.scale.setScalar(1.35);
          duck.rotation.y = -0.35 + Math.sin(t * 2) * 0.1;
          const sq2 = Math.exp(-Math.max(0, t - 68.1) * 6) * (t >= 68.1 ? 1 : 0);
          duckIn.scale.set(1 + 0.2 * sq2 * Math.cos((t - 68.1) * 30), 1 - 0.2 * sq2 * Math.cos((t - 68.1) * 30), 1 + 0.2 * sq2 * Math.cos((t - 68.1) * 30));
        }
      }

      /* ---------- CUADRO FINAL ---------- */
      const SUBS = 6, SHUTTER = 1 / 120;
      const grainEl = el("w-grain");
      const grctx = grainEl.getContext("2d");
      const grImg = grctx.createImageData(540, 960);
      function drawGrain(t) {
        const r = rng(Math.round(t * 60) + 7);
        const d = grImg.data;
        for (let i = 0; i < d.length; i += 4) { const g = r() * 255; d[i] = d[i + 1] = d[i + 2] = g; d[i + 3] = 255; }
        grctx.putImageData(grImg, 0, 0);
      }
      const nUsd = el("n-usd");
      function updateHtml(t) {
        const v = Math.round(4800 * eOut(prog(t, 28.18, 29.3)));
        nUsd.textContent = "US$" + v.toLocaleString("es-CL") + "M";
      }
      function renderAt(t) {
        t = clamp(t, 0, DUR - 1 / 120);
        let si = SHOTS.findIndex((s) => t >= s.a && t < s.b);
        if (si < 0) si = SHOTS.length - 1;
        const shot = SHOTS[si];
        outCtx.globalCompositeOperation = "source-over";
        for (let k = SUBS - 1; k >= 0; k--) {
          const tk = Math.max(shot.a, t - (k / (SUBS - 1)) * SHUTTER);
          updateScene(tk, shot);
          renderer.render(scene, camera);
          outCtx.globalAlpha = 1 / (SUBS - k);
          outCtx.drawImage(glCanvas, 0, 0);
        }
        outCtx.globalAlpha = 1;
        drawGrain(t);
        updateHtml(t);
        let blur = 0;
        for (const cut of BLUR_CUTS) {
          if (t >= cut - 0.26 && t < cut) blur = Math.max(blur, 26 * eIn(prog(t, cut - 0.26, cut)));
          if (t >= cut && t < cut + 0.42) blur = Math.max(blur, 26 * (1 - eOut(prog(t, cut, cut + 0.42))));
        }
        canvas.style.filter = blur > 0.05 ? "blur(" + blur.toFixed(2) + "px)" : "none";
        canvas.style.transform = blur > 0.05 ? "scale(" + (1 + blur * 0.004).toFixed(4) + ")" : "none";
        bctx.globalCompositeOperation = "source-over";
        bctx.drawImage(canvas, 0, 0, 270, 480);
        bctx.globalCompositeOperation = "multiply";
        bctx.drawImage(canvas, 0, 0, 270, 480);
        bctx.drawImage(canvas, 0, 0, 270, 480);
        bloomEl.style.filter = "blur(" + (16 + blur).toFixed(1) + "px)";
        let sw = 0;
        for (const cut of BLUR_CUTS) if (t >= cut - 0.2 && t < cut + 0.2) sw = prog(t, cut - 0.2, cut + 0.2);
        sweepEl.style.opacity = sw > 0 ? String(Math.sin(Math.PI * sw)) : "0";
        sweepEl.style.transform = "translateY(" + (sw * 1920).toFixed(1) + "px)";
        let fl = 0;
        for (const cut of FLASH_CUTS) if (t >= cut && t < cut + 0.6) fl = Math.max(fl, 0.7 * (Math.exp(-(t - cut) * 9) - Math.exp(-5.4)) / (1 - Math.exp(-5.4)));
        flashEl.style.opacity = fl.toFixed(3);
      }

      // Todo texto entra y sale con Fade In y Fade Out.
      const tl = gsap.timeline({ paused: true });
      [["#c-q", 0.0, 4.9], ["#c-sed", 6.0, 9.75], ["#c-esc", 10.9, 15.7], ["#t-tuit", 14.0, 15.7], ["#t-srca", 16.0, 25.2], ["#c-alice", 22.5, 25.2],
       ["#c-usd", 28.18, 30.28], ["#c-mira", 30.34, 33.84], ["#t-srcb", 25.5, 33.8], ["#c-memo", 37.1, 39.18], ["#t-srcc", 34.1, 39.18],
       ["#c-fort", 39.5, 42.42], ["#t-srcd", 39.4, 42.4], ["#c-junta", 42.86, 46.86], ["#c-sillon", 47.15, 53.65], ["#t-ia", 48.2, 51.5],
       ["#c-bill", 55.48, 57.45], ["#c-nd", 61.1, 66.25]].forEach(([sel, at, end]) => {
        tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "sine.inOut" }, at);
        tl.to(sel, { opacity: 0, duration: 0.28, ease: "sine.inOut" }, end - 0.29);
      });
      tl.fromTo("#s-pato", { opacity: 0, scale: 1.45 }, { opacity: 0.95, scale: 1, duration: 0.2, ease: "power3.in" }, 68.1 - 0.2);
      tl.to("#s-pato", { opacity: 0, duration: 0.25, ease: "sine.inOut" }, 70.0);
      tl.fromTo("#w-end", { opacity: 0 }, { opacity: 1, duration: 0.9, ease: "sine.inOut" }, 69.1);
      tl.set({}, {}, 70.3);
      window.__timelines["world"] = tl;

      if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { painters.forEach((p) => p()); screenKey = -1; emailKey = ""; fortKey = ""; tvKey = -2; });
      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      renderAt(0);
    })();
  </script>
</template>
