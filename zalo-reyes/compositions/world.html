      const ell = (parent, m, x, y, z, sx, sy, sz, o) => { const b = ball(1, m, x, y, z, parent, o); b.scale.set(sx, sy, sz); return b; };
      function roundedGeo(w, h, d, r) {
        r = Math.min(r, Math.min(w, h, d) / 2 - 0.001);

      const dmy = new THREE.Object3D();

      const petalGeo = mergeGeos([0, 1, 2, 3, 4].map((i) => {

        const big = i === 0 ? 1.18 : 1;

      const centerGeo = new THREE.SphereGeometry(0.06, 14, 10);
      const VIOLETS = ["#4b2a7a", "#5a2d8c", "#6b3aa0", "#43246c", "#6a2f86", "#7a3a9a"];

        const centers = new THREE.InstancedMesh(centerGeo, mat("#efe3b0", { roughness: 0.6 }), N);
        const q = new THREE.Quaternion(), q2 = new THREE.Quaternion();
        for (let i = 0; i < N; i++) {
          // Fibonacci sobre la cúpula, hasta un poco bajo el ecuador.
          const k = (i + 0.5) / N;
          const pol = Math.acos(1 - k * (1 - Math.cos(1.62)));
          const az = i * 2.39996 + r() * 0.2;
          const n = new THREE.Vector3(Math.sin(pol) * Math.cos(az), Math.cos(pol), Math.sin(pol) * Math.sin(az));
          const rr2 = R * (0.97 + r() * 0.06);
          const p = new THREE.Vector3(CEN.x + n.x * rr2, CEN.y + n.y * rr2 * SQ, CEN.z + n.z * rr2);
          q.setFromUnitVectors(UP, n); q2.setFromAxisAngle(UP, r() * 6.28); q.multiply(q2);
          const fs = 0.6 + r() * 0.16;
          dmy.position.copy(p); dmy.quaternion.copy(q); dmy.scale.setScalar(fs); dmy.updateMatrix();

          petals.setColorAt(i, C(VIOLETS[Math.floor(r() * VIOLETS.length)]));
          dmy.position.addScaledVector(n, 0.03 * fs); dmy.updateMatrix();
          centers.setMatrixAt(i, dmy.matrix);

        g.add(petals, centers);

      album.scale.setScalar(0.8);

      // Colores exactos para lo que no es "material real" (pantallas, textos, LED): sin tone mapping.
      scene.traverse((o) => { if (o.material && o.material.isMeshBasicMaterial) o.material.toneMapped = false; });

      /* ---------- TOMAS ---------- */
      // Cámara con curva continua (Catmull-Rom) entre los puntos clave y una sola curva de velocidad por toma:
      // arranca y frena suave, pero nunca se detiene del todo, así los cortes llegan en movimiento.
      function path(keys, t) {
        const n = keys.length;
        if (n === 1) return keys[0];
        const t0 = keys[0].t, t1 = keys[n - 1].t;
        const x = prog(t, t0, t1);
        const u = 0.3 * x + 0.7 * io(x);
        const tau = t0 + u * (t1 - t0);
        let i = 0;
        while (i < n - 2 && tau > keys[i + 1].t) i++;
        const s = clamp((tau - keys[i].t) / (keys[i + 1].t - keys[i].t));
        const P = (j) => keys[Math.max(0, Math.min(n - 1, j))];
        const cr = (a, b, c, d) => 0.5 * (2 * b + (-a + c) * s + (2 * a - 5 * b + 4 * c - d) * s * s + (-a + 3 * b - 3 * c + d) * s * s * s);
        const out = { p: [0, 0, 0], g: [0, 0, 0] };
        ["p", "g"].forEach((k) => { for (let c = 0; c < 3; c++) out[k][c] = cr(P(i - 1)[k][c], P(i)[k][c], P(i + 1)[k][c], P(i + 2)[k][c]); });
        return out;
      }
      // Encuadres: lo blanco o claro (calendario, hoja, disco) queda sobre los 1180 px; la franja de subtítulos va sobre fondo oscuro.
      const SHOTS = [
        { id: "cal1", a: 0, b: 4.45, set: calSet, grad: true, light: [6, 14, 12], tg: [0, 1.5, 0], r: 8, cam: [
          { t: 0, p: [0.35, 2.3, 14.6], g: [0.05, 1.42, 0] },
          { t: 2.7, p: [0.6, 2.9, 18.6], g: [0.1, 1.62, 0] },
          { t: 4.45, p: [0.75, 3.0, 19.6], g: [0.1, 1.66, 0] } ] },
        { id: "rec", a: 4.45, b: 8.4, set: recSet, grad: true, light: [6, 16, 10], tg: [0, 0.5, 0], r: 8, cam: [
          { t: 4.45, p: [2.6, 6.2, 5.2], g: [-0.5, 0.5, 0] },
          { t: 6.2, p: [1.6, 6.8, 6.6], g: [-0.4, 0.9, -0.2] },
          { t: 8.4, p: [0.4, 6.0, 13.0], g: [0, 2.85, -0.8] } ] },
        { id: "spain", a: 8.4, b: 19.44, set: spainSet, bg: "#000000", sun: 1.6, light: [-10, 30, 14], tg: [0.5, 0, 0], r: 12, cam: [
          { t: 8.4, p: [1.0, 33, 19], g: [0.9, 0, -0.6] },
          { t: 9.63, p: [0.9, 27.5, 18], g: [0.9, 0, 0.1] },
          { t: 15.32, p: [0.8, 25.5, 17.2], g: [0.8, 0, 0.3] },
          { t: 19.44, p: [2.2, 9.6, 10.4], g: [1.3, 0, -1.2] } ] },
        { id: "guitar", a: 19.44, b: 23.02, set: guitarSet, grad: true, light: [6, 16, 12], tg: [0, 2.5, 0], r: 9, cam: [
          { t: 19.44, p: [0.6, 4.0, 15.2], g: [0, 3.5, 0] },
          { t: 23.02, p: [-0.2, 3.8, 13.6], g: [0, 3.45, 0] } ] },
        { id: "chile", a: 23.02, b: 27.62, set: chileSet, bg: "#000000", sun: 1.7, light: [-14, 40, 8], tg: [0, 0, -3], r: 24, cam: [
          { t: 23.02, p: [0.3, 80, 8.5], g: [0.0, 0, -0.6] },
          { t: 25.0, p: [0.6, 23, 5.2], g: [0.4, 0, -2.6] },
          { t: 27.62, p: [0.7, 18, 4.8], g: [0.4, 0, -2.8] } ] },
        { id: "pin", a: 27.62, b: 29.58, set: chileSet, bg: "#000000", sun: 1.7, light: [-8, 22, 6], tg: [0.3, 0, -2.9], r: 6, cam: [
          { t: 27.62, p: [2.1, 2.5, 1.3], g: [0.3, 1.25, -2.9] },
          { t: 29.58, p: [1.7, 2.15, 0.6], g: [0.3, 1.3, -2.9] } ] },
        { id: "album", a: 29.58, b: 34.0, set: albumSet, grad: true, light: [6, 16, 12], tg: [0, 2.5, 0], r: 8, cam: [
          { t: 29.58, p: [0.7, 3.3, 15.4], g: [0.0, 2.45, 0] },
          { t: 34.0, p: [0.0, 3.1, 13.9], g: [0.0, 2.5, 0] } ] },
        { id: "cal2", a: 34.0, b: 38.3, set: calSet, grad: true, light: [6, 14, 12], tg: [0, 1.5, 0], r: 8, cam: [
          { t: 34.0, p: [-0.5, 2.1, 11.8], g: [-0.95, 1.2, 0] },

        { id: "door", a: 38.3, b: 41.92, set: doorSet, grad: true, light: [5, 9, 14], tg: [0, 1, 0], r: 8, cam: [
          { t: 38.3, p: [1.1, 2.4, 10.4], g: [0.15, 1.75, 0] },
          { t: 41.92, p: [0.5, 2.0, 8.8], g: [0.15, 1.45, 0.4] } ] },
        { id: "trad", a: 41.92, b: 48.53, set: chileSet, bg: "#000000", sun: 1.7, light: [-14, 40, 8], tg: [0, 0, -3], r: 24, cam: [
          { t: 41.92, p: [0.5, 11, 3.6], g: [0.3, 0, -2.9] },
          { t: 44.4, p: [0.4, 30, 9.5], g: [0.2, 0, -2.5] },
          { t: 48.53, p: [0.3, 33, 10.5], g: [0.1, 0, -2.3] } ] },
        { id: "hero", a: 48.53, b: DUR + 1, set: heroSet, grad: true, light: [6, 14, 12], tg: [0, 2, 0], r: 7, cam: [
          { t: 48.53, p: [2.2, 3.9, 11.0], g: [0, 1.95, 0] },
          { t: DUR, p: [-0.9, 3.7, 10.0], g: [0, 1.95, 0] } ] },
      ];
      const SH = Object.fromEntries(SHOTS.map((s) => [s.id, s]));
      const allSets = SHOTS.map((s) => s.set).filter((s, i, a) => a.indexOf(s) === i);
      const BLUR_CUTS = [8.4, 23.02, 34.0, 41.92];
      const FLASH_CUTS = [2.77, 9.75, 18.47, 26.73, 29.62, 44.55, 46.1]; // destello solo al aparecer cada foto

      // Tarjetas: [tarjeta, toma, aparece, sale, x, y, alto en px, instante de encuadre, fracción de distancia]
      const CARDS = [
        [fTraje, "cal1", 2.77, 99, 540, 450, 470, 3.3, 0.7],
        [fCec, "spain", 9.75, 15.4, 540, 875, 540, 12.5, 0.5],
        [fManz, "spain", 18.47, 99, 770, 820, 470, 19.0, 0.55],
        [f80, "chile", 26.73, 27.45, 560, 820, 560, 27.1, 0.5],
        [fSilla, "trad", 44.55, 99, 300, 820, 500, 46.5, 0.55],
        [fViol, "trad", 46.1, 99, 780, 840, 500, 46.5, 0.55],
      ];
      CARDS.forEach(([card, sid, at, end, px, py, hpx, ta, frac]) => anchorCard(card, SH[sid], ta, px, py, hpx, frac));
      // Manzanita sigue en la toma de la guitarra, a la izquierda y detrás.
      anchorCard(fManz2, SH.guitar, 21.2, 310, 720, 600, 1.15);

      function updateScene(t, shot, si) {
        allSets.forEach((s) => (s.visible = s === shot.set));
        scene.background = shot.grad ? gradTex : C(shot.bg);
        const c = path(shot.cam, t);
        camera.position.set(c.p[0] + Math.sin(t * 0.63) * 0.05, c.p[1] + Math.sin(t * 0.81 + 1.3) * 0.04, c.p[2]);
        camera.up.set(0, 1, 0);
        camera.lookAt(c.g[0], c.g[1], c.g[2]);
        camera.updateMatrixWorld(true);
        sunLight.position.set(shot.light[0], shot.light[1], shot.light[2]);
        sunLight.target.position.set(shot.tg[0], shot.tg[1], shot.tg[2]);
        sunLight.intensity = shot.sun || 2.2;
        const sc = sunLight.shadow.camera;
        sc.left = -shot.r; sc.right = shot.r; sc.top = shot.r; sc.bottom = -shot.r; sc.near = 1; sc.far = 220;
        sc.updateProjectionMatrix();
        hemi.intensity = 0.5;
        rimLight.intensity = 1.5;
        spot.intensity = 0;
        CARDS.forEach(([card, sid, at, end], i) => { if (card.g.parent === shot.set) card.g.visible = false; if (sid === shot.id) showCard(card, t, at, end, i); });

        if (shot.set === calSet) {
          const second = t >= 34;
          drawCal(second ? io(prog(t, 34.55, 35.3)) : 0);
          calBq.rotation.y = 0.6 + Math.sin(t * 0.5) * 0.04;
          // Hoja con la letra: entra deslizándose y se resalta "cada 9 de noviembre".
          sheet.visible = second && t >= 35.84;
          const k = settle(prog(t, 35.84, 36.6));
          sheet.position.set(mix(2.6, -0.55, k), mix(0.6, 1.95, k) + Math.sin(t * 1.4) * 0.02, mix(3.2, 1.45, k));
          sheet.rotation.set(-0.08 + (1 - k) * -0.6, mix(-0.9, 0.08, k), mix(0.5, -0.04, k));
          drawLyr(io(prog(t, 37.4, 37.95)));
        }

        if (shot.set === recSet) {
          vinyl.rotation.y = -t * 3.49;
          const drop = io(prog(t, 4.45, 5.0));
          arm.rotation.y = mix(-0.32, -0.62, drop);
          arm.rotation.x = 0.03 * (1 - drop);
          FMTS.forEach(([o, at], i) => {
            const k = settle(prog(t, at, at + 0.55));
            o.visible = t >= at;
            o.scale.setScalar(Math.max(0.001, 0.82 * k));
            o.rotation.set(0.05 + Math.sin(t * 1.1 + i) * 0.05, (i - 1) * -0.28 + Math.sin(t * 0.9 + i) * 0.08 + (1 - k) * 1.2, 0);
            o.position.y = (i === 1 ? 3.6 : 3.0) + Math.sin(t * 1.6 + i * 2) * 0.06;
          });
          cd.rotation.z = t * 0.6;
        }

        if (shot.set === spainSet) {
          // "España": las provincias se encienden en ola desde Madrid. Luego, foco en Madrid ("el madrileño").
          const foc = io(prog(t, 17.75, 18.4));
          Object.values(ESP).forEach((R) => {
            const at = 8.62 + R.d * 0.07;
            const k = settle(prog(t, at, at + 0.7));
            const w = Math.sin(Math.PI * clamp(prog(t, at, at + 0.7)));
            const isM = R === madrid;
            const col = C("#5e5e69").lerp(C("#8a2466"), 0.6 * clamp(k)).lerp(C("#CA3390"), 0.45 * w);
            if (isM) col.lerp(C("#CA3390"), foc); else col.multiplyScalar(1 - 0.5 * foc);
            R.m.material.color.copy(col);
            R.m.material.emissive.set("#CA3390");
            R.m.material.emissiveIntensity = 0.25 * w + (isM ? 0.4 * foc : 0);
            const y = 0.22 * w + (isM ? 0.18 * foc : 0);
            R.m.position.y = y; R.lines.position.y = y;
          });
          madPin.g.visible = t >= 17.75;
          const pk = settle(prog(t, 17.75, 18.3));
          madPin.inner.scale.setScalar(Math.max(0.001, pk * 1.6));
          madPin.g.position.y = 0.3 + 0.18 * foc;
          const ph = ((t - 17.8) * 0.9) % 1;
          madPin.tor.scale.setScalar(1.6 * (0.6 + ph * 1.6));
          madPin.tor.material.opacity = foc * (1 - ph) * 0.9;
          hemi.intensity = 0.55 * (1 - 0.4 * foc);
        }

        if (shot.set === guitarSet) {
          const k = settle(prog(t, 19.44, 20.3));
          guitar.scale.setScalar(0.68);
          guitar.position.set(mix(5.0, 0.8, k), 3.2 + Math.sin(t * 1.2) * 0.06, mix(-2, 0.4, k));
          guitar.rotation.set(0.05, -0.35 + Math.sin(t * 0.7) * 0.12 + (1 - k) * 1.6, -0.3 + (1 - k) * 0.4);
          // Rasgueo en "flamenco": las cuerdas vibran y se apagan.
          const st = [20.7, 21.97].reduce((a, at) => a + (t >= at ? Math.exp(-(t - at) * 3.2) : 0), 0);
          strings.forEach((S2, i) => { S2.s.position.x = S2.x + Math.sin(t * 95 + i * 1.3) * 0.012 * st; });
          gInner.rotation.z = Math.sin(t * 38) * 0.004 * st;
          fManz2.g.visible = true;
          fManz2.inner.rotation.set(0, Math.sin(t * 0.8) * 0.05, 0);
          fManz2.inner.scale.setScalar(1);
          fManz2.glow.material.opacity = 0.3;
          drawCard(fManz2, 0);
        }

        if (shot.set === chileSet) {
          const trad = shot.id === "trad", pinShot = shot.id === "pin";
          // Foco en la Región Metropolitana ("popularizada").
          const foc = trad ? 0 : io(prog(t, 24.0, 24.8));
          Object.values(CHL).forEach((R) => {
            const isR = R === rm;
            const col = C("#6a6a75");
            // En el primer plano del pin, la región va más oscura para que se lean los subtítulos.
            if (isR) col.lerp(C(pinShot ? "#4a1239" : "#9c2a75"), foc); else col.multiplyScalar(1 - 0.45 * foc);
            R.m.material.color.copy(col);
            R.m.material.emissive.set("#CA3390");
            R.m.material.emissiveIntensity = isR ? (pinShot ? 0 : 0.18) * foc : 0;
            R.m.material.envMapIntensity = pinShot ? 0.35 : 1;
            R.m.position.y = R.lines.position.y = 0;
          });
          coPin.g.visible = pinShot;
          const pk = settle(prog(t, 27.62, 28.1));
          coPin.inner.scale.setScalar(Math.max(0.001, pk));
          const ph = ((t - 27.62) * 0.9) % 1;
          coPin.tor.scale.setScalar(0.45 + ph * 0.6);
          coPin.tor.material.opacity = clamp(pk) * (1 - ph) * 0.25;
          // El gorrión llega volando y se posa sobre el pin de Conchalí.
          const fly = prog(t, 27.85, 28.75);
          sparrow.g.visible = pinShot && t >= 27.85;
          const top = new THREE.Vector3(CO.x, 0.3 + 0.84 + 0.14 + 0.25, CO.z);
          const from = new THREE.Vector3(CO.x - 2.6, 2.6, CO.z - 1.8);
          const e = eOut(fly);
          const pos = from.clone().lerp(top, e);
          pos.y += Math.sin(Math.PI * e) * 0.5;
          const hop = t >= 29.05 ? Math.abs(Math.sin(Math.PI * prog(t, 29.05, 29.35))) * 0.09 : 0;
          sparrow.g.position.copy(pos); sparrow.g.position.y += hop;
          const head = mix(Math.atan2(top.x - from.x, top.z - from.z), 0.45, io(prog(t, 28.6, 29.0)));
          sparrow.g.rotation.set(mix(0.25, 0, io(fly)), head, 0);
          const flying = fly < 1 ? 1 : 0;
          sparrow.wings.forEach((W) => { W.w.rotation.z = W.sd * (flying ? 0.25 + 0.95 * (0.5 + 0.5 * Math.sin(t * 46)) : 0.05 * (1 - prog(t, 28.75, 28.95))); });
          sparrow.head.rotation.set(t > 28.9 ? Math.sin((t - 28.9) * 6) * 0.12 : 0, t > 28.9 ? Math.sin((t - 28.9) * 3.5) * 0.4 : 0, t > 29.1 ? 0.25 * io(prog(t, 29.1, 29.35)) : 0);
          sparrow.legs.forEach((L) => (L.rotation.x = flying ? 0.9 : 0));
          // Tradición: ramitos que brotan desde Conchalí hacia todo Chile.
          updateMinis(t, trad);
          hemi.intensity = 0.55 * (1 - 0.35 * foc);
        }

        if (shot.set === albumSet) {
          const k = settle(prog(t, 29.62, 30.4));
          album.position.set(-0.6, 3.0 + Math.sin(t * 1.2) * 0.05, 0);
          album.rotation.set(0.02, mix(-1.3, -0.12, k) + Math.sin(t * 0.7) * 0.04, 0);
          album.scale.setScalar(Math.max(0.001, 0.8 * mix(0.75, 1, k)));
          const out = settle(prog(t, 30.3, 31.2));
          albVinyl.position.set(mix(0, 1.55, out), 0, -0.13);
          av.rotation.y = -t * 1.2;
          fDisco.g.visible = true;
          fDisco.inner.rotation.set(0, 0, 0); fDisco.inner.scale.setScalar(1);
          fDisco.glow.material.opacity = 0.35 * clamp(k);
          drawCard(fDisco, prog(t, 30.0, 30.9));
        }

        if (shot.set === doorSet) {
          sunLight.intensity = 0.5;
          hemi.intensity = 0.32;
          spot.intensity = 7.5;
          spot.angle = 0.55; spot.penumbra = 0.55;
          spot.position.set(-3.6, 5.2, 9.5);
          spot.target.position.set(0.4, 1.0, 0);
          spot.target.updateMatrixWorld();
          // La sombra del admirador entra, deja el ramito y se va.
          const inK = io(prog(t, 38.4, 39.7)), outK = io(prog(t, 40.45, 41.6));
          ghost.position.set(mix(-5.5, -1.7, inK) + 5.5 * outK, 0, 4.2 + Math.sin(t * 7) * 0.02 * (inK - outK));
          ghost.rotation.z = Math.sin(t * 9) * 0.02 * (inK - outK);
          const bk = settle(prog(t, 40.15, 40.75));
          doorBq.visible = t >= 40.15;
          // Ramito acostado sobre el felpudo: tallos a la izquierda, flores a la derecha.
          doorBq.position.set(mix(-2.3, -0.5, bk), 0.45, mix(2.6, 0.95, bk));
          doorBq.rotation.set(0, -0.2, -Math.PI / 2 + 0.06);
          // Tarjeta "?" colgando de la cinta, hacia la cámara.
          tagSwing.visible = doorBq.visible;
          tagSwing.position.set(doorBq.position.x + 0.22, 0.98, doorBq.position.z + 0.62);
          tagSwing.rotation.set(0, 0.1, Math.sin((t - 40.15) * 6) * 0.3 * Math.exp(-Math.max(0, t - 40.6) * 1.5));
        }

        if (shot.set === heroSet) {
          heroRot.rotation.y = -0.4 + (t - 48.53) * 0.32;
          const k = settle(prog(t, 48.53, 49.2));
          heroRot.scale.setScalar(Math.max(0.001, mix(0.9, 1, k)));
        }
      }

      // Motion blur real: 6 muestras dentro de un obturador de 180° a 60 fps (1/120 s), promediadas.
      // Nunca mezcla dos tomas: las muestras no retroceden antes del inicio de la toma actual.
      const SUBS = 6, SHUTTER = 1 / 120;
      const grainEl = document.getElementById("w-grain");
      const grctx = grainEl.getContext("2d");
      const grImg = grctx.createImageData(540, 960);
      function drawGrain(t) {
        const r = rng(Math.round(t * 60) + 7);
        const d = grImg.data;
        for (let i = 0; i < d.length; i += 4) { const g = r() * 255; d[i] = d[i + 1] = d[i + 2] = g; d[i + 3] = 255; }
        grctx.putImageData(grImg, 0, 0);
      }
      const el = (id) => document.getElementById(id);
      const nYear = el("n-year"), n1985 = el("n-1985");
      function updateHtml(t) {
        nYear.textContent = String(Math.round(mix(1974, 1981, eOut(prog(t, 16.35, 17.3)))));
        n1985.textContent = String(Math.round(mix(1981, 1985, eOut(prog(t, 25.03, 25.7)))));
      }
      function renderAt(t) {
        t = clamp(t, 0, DUR - 1 / 120);
        let si = SHOTS.findIndex((s) => t >= s.a && t < s.b);
        if (si < 0) si = SHOTS.length - 1;
        const shot = SHOTS[si];
        outCtx.globalCompositeOperation = "source-over";
        for (let k = SUBS - 1; k >= 0; k--) {
          const tk = Math.max(shot.a, t - (k / (SUBS - 1)) * SHUTTER);
          updateScene(tk, shot, si);
          renderer.render(scene, camera);
          outCtx.globalAlpha = 1 / (SUBS - k);
          outCtx.drawImage(glCanvas, 0, 0);
        }
        outCtx.globalAlpha = 1;
        drawGrain(t);
        updateHtml(t);
        let blur = 0;
        for (const cut of BLUR_CUTS) {
          if (t >= cut - 0.26 && t < cut) blur = Math.max(blur, 26 * eIn(prog(t, cut - 0.26, cut)));
          if (t >= cut && t < cut + 0.42) blur = Math.max(blur, 26 * (1 - eOut(prog(t, cut, cut + 0.42))));
        }
        canvas.style.filter = blur > 0.05 ? "blur(" + blur.toFixed(2) + "px)" : "none";
        canvas.style.transform = blur > 0.05 ? "scale(" + (1 + blur * 0.004).toFixed(4) + ")" : "none";
        bctx.globalCompositeOperation = "source-over";
        bctx.drawImage(canvas, 0, 0, 270, 480);
        bctx.globalCompositeOperation = "multiply";
        bctx.drawImage(canvas, 0, 0, 270, 480);
        bctx.drawImage(canvas, 0, 0, 270, 480);
        bloomEl.style.filter = "blur(" + (16 + blur).toFixed(1) + "px)";
        let sw = 0;
        for (const cut of BLUR_CUTS) if (t >= cut - 0.2 && t < cut + 0.2) sw = prog(t, cut - 0.2, cut + 0.2);
        sweepEl.style.opacity = sw > 0 ? String(Math.sin(Math.PI * sw)) : "0";
        sweepEl.style.transform = "translateY(" + (sw * 1920).toFixed(1) + "px)";
        let fl = 0;
        // Destello que se apaga del todo (llega a 0 justo al final de su ventana, sin escalón).
        for (const cut of FLASH_CUTS) if (t >= cut && t < cut + 0.6) fl = Math.max(fl, 0.75 * (Math.exp(-(t - cut) * 9) - Math.exp(-5.4)) / (1 - Math.exp(-5.4)));
        flashEl.style.opacity = fl.toFixed(3);
      }
