        parent.add(m);
        return m;
      }
      const box = (w, h, d, color, x, y, z, parent, o) => add(new THREE.BoxGeometry(w, h, d), color, x, y, z, parent, o);
      const cyl = (r1, r2, h, color, x, y, z, parent, o) => add(new THREE.CylinderGeometry(r1, r2, h, 40), color, x, y, z, parent, o);
      const ball = (r, color, x, y, z, parent, o) => add(new THREE.SphereGeometry(r, 32, 22), color, x, y, z, parent, o);
      const group = (parent, x = 0, y = 0, z = 0) => { const g = new THREE.Group(); g.position.set(x, y, z); parent.add(g); return g; };
      function roundedGeo(w, h, d, r) {
        r = Math.min(r, Math.min(w, h, d) / 2 - 0.001);
        const s = new THREE.Shape();
        const x = -w / 2 + r, y = -h / 2 + r, iw = w - 2 * r, ih = h - 2 * r;
        s.moveTo(x, y - r);
        s.lineTo(x + iw, y - r);
        s.absarc(x + iw, y, r, -Math.PI / 2, 0, false);
        s.lineTo(x + iw + r, y + ih);
        s.absarc(x + iw, y + ih, r, 0, Math.PI / 2, false);
        s.lineTo(x, y + ih + r);
        s.absarc(x, y + ih, r, Math.PI / 2, Math.PI, false);
        s.lineTo(x - r, y);
        s.absarc(x, y, r, Math.PI, Math.PI * 1.5, false);
        const g = new THREE.ExtrudeGeometry(s, { depth: Math.max(0.001, d - 2 * r), bevelEnabled: true, bevelThickness: r, bevelSize: r, bevelOffset: -r, bevelSegments: 5, curveSegments: 8 });
        g.translate(0, 0, -(d - 2 * r) / 2);
        return g;
      }
      const rb = (w, h, d, r, color, x, y, z, parent, o) => add(roundedGeo(w, h, d, r), color, x, y, z, parent, o);
      function lathe(points, color, x, y, z, parent, o) {
        return add(new THREE.LatheGeometry(points.map((p) => new THREE.Vector2(p[0], p[1])), 56), color, x, y, z, parent, o);
      }

        box(420, 1, 420, color, 0, -0.5, 0, parent, { cast: false });

      function textTex(w, h, draw) {
        const c = document.createElement("canvas");

        const tx = new THREE.CanvasTexture(c);
        tx.colorSpace = THREE.SRGBColorSpace;
        tx.anisotropy = 8;
        return tx;
      }
      function figureGeos(k) {

      }
      // Sombra difusa y humo: sprites radiales, sin bordes.
      const puffCanvas = document.createElement("canvas");
      puffCanvas.width = puffCanvas.height = 128;
      const pctx = puffCanvas.getContext("2d");

      pgrad.addColorStop(0.5, "rgba(255,255,255,0.45)");

      pctx.fillRect(0, 0, 128, 128);
      const puffTex = new THREE.CanvasTexture(puffCanvas);

      /* ---------- Logo real de Ueno Bank (archivo del usuario) ---------- */
      const logoImg = document.getElementById("w-logo");
      const logoMats = [];
      let logoReady = false;
      function logoPlane(w, parent, x, y, z) {

        logoMats.push(m);
        const p = new THREE.Mesh(new THREE.PlaneGeometry(w, w * 563 / 1000), m);
        p.position.set(x, y, z);
        parent.add(p);
        return p;
      }
      function ensureLogo() {
        if (logoReady || !logoImg.complete || !logoImg.naturalWidth) return;
        const lc = document.createElement("canvas");
        lc.width = logoImg.naturalWidth; lc.height = logoImg.naturalHeight;
        lc.getContext("2d").drawImage(logoImg, 0, 0);
        const tx = new THREE.CanvasTexture(lc);
        tx.colorSpace = THREE.SRGBColorSpace;
        tx.anisotropy = 8;
        logoMats.forEach((m) => { m.map = tx; m.opacity = 1; m.needsUpdate = true; });
        logoReady = true;
      }

      /* ---------- 1. CELULAR ---------- */
      const phoneSet = group(scene);
      floorSet(phoneSet, "#0b0b10", 0.2);
      const phone = group(phoneSet, 0, 5.0, 0);
      rb(3.34, 6.84, 0.3, 0.3, "#1d1d25", 0, 0, 0, phone);
      rb(3.42, 6.92, 0.18, 0.32, "#3a3a44", 0, 0, -0.08, phone);
      const scrC = document.createElement("canvas");
      scrC.width = 560; scrC.height = 1180;
      const sx = scrC.getContext("2d");
      const scrTex = new THREE.CanvasTexture(scrC);
      scrTex.colorSpace = THREE.SRGBColorSpace;
      scrTex.anisotropy = 8;
      const scr = new THREE.Mesh(new THREE.PlaneGeometry(3.08, 6.5), new THREE.MeshBasicMaterial({ map: scrTex }));
      scr.position.z = 0.156;
      phone.add(scr);
      function rr(c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); }
      function drawScreen(t) {
        const W = 560, H = 1180;
        const blocked = t >= 4.12;
        sx.fillStyle = "#0a0a0f";
        sx.fillRect(0, 0, W, H);
        sx.textAlign = "center";
        // Barra superior y logo

        // Saldo y botones de la app, sin cifras
        sx.fillStyle = "#ffffff";
        sx.font = "34px Bahnschrift, sans-serif";
        if (!blocked) {
          sx.fillText("Saldo disponible", W / 2, 292);
          sx.font = "700 62px Montserrat, sans-serif";
          sx.fillText("• • • • • •", W / 2, 368);
          const failing = t >= 2.9;
          [["Transferir", 430], ["Pagar", 560], ["Tarjetas", 690]].forEach(([label, y], i) => {
            const off = failing && i === 0;
            rr(sx, 60, y, W - 120, 104, 22);
            sx.fillStyle = off ? "#CA0010" : "#1d1d25";
            sx.fill();
            sx.fillStyle = "#ffffff";
            sx.font = "36px Bahnschrift, sans-serif";
            sx.fillText(label, W / 2, y + 65);
          });
          if (t >= 1.4 && t < 2.9) {
            // Conectando: el anillo gira y no llega a nada.
            sx.strokeStyle = "#CA3390";
            sx.lineWidth = 9;
            sx.lineCap = "round";
            sx.beginPath();
            const a = t * 7;
            sx.arc(W / 2, 920, 46, a, a + 4.2);

            sx.fillStyle = "#c9c9d2";
            sx.font = "30px Bahnschrift, sans-serif";

          }
        } else {
          // Parpadea en rojo y queda bloqueada.
          const blink = t < 4.74 ? 0.35 + 0.65 * (Math.sin(t * 34) > 0 ? 1 : 0) : 0.72;
          sx.fillStyle = "rgba(202,0,16," + blink + ")";
          sx.fillRect(0, 0, W, H);

          sx.strokeStyle = "#ffffff";
          sx.lineWidth = 20;
          sx.beginPath();
          sx.arc(W / 2, y0, 62, Math.PI, 0);
          sx.lineTo(W / 2 + 62, y0 + 40);
          sx.moveTo(W / 2 - 62, y0);

          sx.fill();
          sx.fillStyle = "#ffffff";
          sx.font = "700 40px Montserrat, sans-serif";
          sx.fillText("Acceso bloqueado", W / 2, y0 + 270);

      rb(11, 7, 4.6, 0.15, "#1b1b22", 0, 4.4, -1.1, bankSet);
      for (let i = 0; i < 6; i++) cyl(0.36, 0.42, 5.9, "#6a6a75", -5 + i * 2, 3.95, 1.9, bankSet);
