    (function () {

      /* ---------- Piezas lisas ---------- */

      const box = (w, h, d, color, x, y, z, parent, o) => add(new THREE.BoxGeometry(w, h, d), color, x, y, z, parent, o);
      const cyl = (r1, r2, h, color, x, y, z, parent, o) => add(new THREE.CylinderGeometry(r1, r2, h, 48), color, x, y, z, parent, o);

      const group = (parent, x = 0, y = 0, z = 0) => { const g = new THREE.Group(); g.position.set(x, y, z); parent.add(g); return g; };
      function roundedGeo(w, h, d, r) {
        r = Math.min(r, Math.min(w, h, d) / 2 - 0.001);
        const s = new THREE.Shape();
        const x = -w / 2 + r, y = -h / 2 + r, iw = w - 2 * r, ih = h - 2 * r;
        s.moveTo(x, y - r);

          pad1.rotation.y = -0.5 + t * 0.35;
          pad1.rotation.x = 0.35;
          pad1.position.y = 3.5 + Math.sin(t * 2.2) * 0.1;
        }

        if (shot.set === reportSet) {
          const d = settle(prog(t, 3.45, 4.1));
          report.position.set(mix(-0.4, 0, d), 0.1 + (1 - d) * 1.2, mix(-0.6, 0, d));
          report.rotation.y = mix(-0.3, 0.05, d);
        }

        if (shot.set === roomSet) {
          const night = !!shot.night;
          drawGame(mon.t, t, night);
          drawDeskClock(night ? "03:00" : "18:30");
          moon.visible = night;
          winGlassMat.color.set(night ? "#07070f" : "#3a3a48");
          lamp.intensity = night ? 9 : 2.5;
          hemi.intensity = night ? 0.22 : 0.95;
          sunLight.intensity = night ? 0.35 : 2.2;
          rimLight.intensity = night ? 0.9 : 1.5;
          kid.rotation.z = Math.sin(t * 3.1) * 0.02;
          kid.position.y = 1.72 + Math.abs(Math.sin(t * 5.2)) * 0.02;
          if (night && t >= 61.41) { deskClock.updateWorldMatrix(true, false); wp.set(0, 0.35, 0); deskClock.localToWorld(wp); pin("p-clock", wp.x, wp.y, wp.z, 26, 330); }
        }

        if (shot.set === gridSet) {
          updateGrid(t);
          n36.textContent = Math.round(36 * eOut(prog(t, 10.6, 11.25))) + "%";
        }

        if (shot.set === barsSet) {
          const hc = 36 * K * settle(prog(t, 14.95, 15.55));
          const ho = 26 * K * settle(prog(t, 15.15, 15.75));
          barChile.g.scale.y = Math.max(0.001, hc);
          barOcde.g.scale.y = Math.max(0.001, ho);
          barChile.m.emissive.set("#CA3390").multiplyScalar(0.18);
          pin("p-chile", -1.6, hc, 1.15, 24, 330);
          pin("p-ocde", 1.6, ho, 1.15, 24, 420);
        }

        if (shot.set === clockSet) {
          const h = 7 * io(prog(t, 17.9, 19.95));
          drawFace(h);
          hourH.rotation.z = -(h / 12) * Math.PI * 2;
          minH.rotation.z = -h * Math.PI * 2;
          CK.rotation.y = Math.sin(t * 0.6) * 0.08;
        }

        if (shot.set === bookSet) {
          const tip = drawPage(io(prog(t, 20.8, 23.4)));
          const px = (tip[0] / 1000 - 0.5) * 5.1, pz = (tip[1] / 700 - 0.5) * 3.6;
          pencil.position.set(px * Math.cos(0.06) + pz * Math.sin(0.06), 0.25, pz * Math.cos(0.06) - px * Math.sin(0.06));
          pencil.rotation.set(-0.5, 0, -0.45);
        }

        if (shot.set === arenaSet) {
          screens.forEach((s) => drawGame(s, t + 3, false));
          beams.forEach((b, i) => { b.rotation.z = Math.sin(t * 0.9 + i * 1.7) * 0.35; b.rotation.x = Math.cos(t * 0.7 + i) * 0.15; });
          arenaTrophy.rotation.y = t * 0.6;
        }

        if (shot.set === cardsSet) {
          const gq = io(prog(t, 43.0, 43.85));
          PLAYERS.forEach((pl, i) => {
            const k = settle(prog(t, pl.at, pl.at + 0.7));
            pl.g.visible = t >= pl.at;
            pl.inner.rotation.y = mix(-1.35, 0, k) + Math.sin(t * 0.8 + i) * 0.05 * (1 - gq);
            pl.inner.scale.setScalar(mix(0.8, 1, k));
            const s = mix(1, 0.62, gq);
            pl.g.scale.setScalar(s);
            pl.g.position.set(mix(pl.row[0], pl.grid[0], gq), mix(pl.row[1], pl.grid[1], gq) + Math.sin(t * 1.4 + i) * 0.06, 0);
            pl.glow.material.opacity = 0.35 * clamp(k);
            drawCard(pl, prog(t, pl.at + 0.35, pl.at + 1.25));
          });
        }

        if (shot.set === labSet) {
          bubbles.forEach((b) => {
            const age = (t * b.sp * 0.5 + b.off) % 1;
            b.m.position.set(b.x * (1 - age * 0.6), 0.1 + age * 1.0, b.z * (1 - age * 0.6));
            b.m.material.opacity = 0.8 * Math.sin(Math.PI * age);
          });
          labGlow.material.opacity = 0.35 + 0.1 * Math.sin(t * 3);
        }

        if (shot.set === brainSet) {
          const calm = t >= 53.4;
          brain.rotation.y = calm ? 0.12 - (t - 53.4) * 0.06 : -0.15 + (t - 47.15) * 0.06;
          brain.position.y = 4.0 + Math.sin(t * 1.6) * 0.08;
          const lit = calm ? 1 : io(prog(t, 47.6, 49.2));
          for (let i = 0; i < SN; i++) {
            const d = synData[i];
            const pulse = calm ? 0.55 + 0.35 * Math.sin(t * 1.2 + d.ph) : clamp(0.5 + 0.5 * Math.sin(t * d.sp + d.ph));
            syn.setColorAt(i, col("#a07a95", calm ? "#ffd6ee" : "#ffffff", pulse * lit));
          }
          syn.instanceColor.needsUpdate = true;
          brainMat.emissive.set(calm ? "#ee8ccb" : "#CA3390");
          brainMat.emissiveIntensity = calm ? 0.16 : 0.08 + 0.12 * lit;
          brainGlow.material.color.set(calm ? "#ee8ccb" : "#CA3390");
          brainGlow.material.opacity = calm ? 0.3 : 0.32 * lit;
          brainGlow.position.set(0, 0, -1.2);
          if (!calm && t >= 48.83) pin("p-neuro", 0, 4.0 + 1.75 * 0.9, 0, 30, 380);
          if (calm && t >= 54.05) pin("p-salud", 0, 4.0 + 1.75 * 0.9, 0, 30, 320);
        }

        if (shot.set === gaugeSet) {
          const swing = settle(prog(t, 50.35, 51.1));
          const jit = t > 51.51 ? Math.sin((t - 51.51) * 11) * 0.03 * Math.exp(-(t - 51.51) * 2) : 0;
          const val = mix(0.04, 0.73, swing) + jit;
          needle.rotation.z = (0.5 - val) * Math.PI;
          gaugePad.rotation.y = 0.4 + Math.sin(t * 1.3) * 0.25;
          gaugePad.position.y = 0.42 + Math.max(0, Math.sin((t - 51.51) * 9)) * 0.25 * prog(t, 51.51, 51.6) * Math.exp(-Math.max(0, t - 51.51) * 2.5);
        }

        if (shot.set === balSet) {
          const tiltIn = 0.16 * (1 - settle(prog(t, 55.9, 56.9)));
          const pigLand = settle(prog(t, 57.35, 58.0));
          const a = tiltIn + 0.24 * pigLand;
          beam.rotation.z = a;
          pans.forEach((p) => p.g.position.set(PIV.x + Math.cos(a) * p.sd * ARM, PIV.y + Math.sin(a) * p.sd * ARM, 0));
          const drop = prog(t, 57.0, 57.35);
          pig.visible = t >= 57.0;
          const panL = pans[0].g.position;
          pig.position.set(panL.x - 0.1, panL.y - 2.02 + 0.32 + (1 - drop * drop) * 8, 0);
          pig.rotation.y = -0.6;
          balPad.rotation.y = 0.3;
          hourglass.rotation.y = t * 0.2;
        }

        if (shot.set === trophySet) {
          const d = settle(prog(t, 63.35, 64.6));
          finalTrophy.position.y = 1.6 + (1 - d) * 7;
          finalTrophy.rotation.y = t * 0.5;
          lightBeam.material.opacity = 0.16 * io(prog(t, 63.2, 63.8));
          trophyGlow.material.opacity = 0.45 * io(prog(t, 64.3, 65.2));
          motes.forEach((m) => {
            const age = ((t - 63.2) * m.sp + m.off) % 1;
            m.m.position.set(Math.cos(m.a + t * 0.3) * m.r, 1.7 + age * 9, Math.sin(m.a + t * 0.3) * m.r);
            m.m.scale.setScalar(m.s);
            m.m.material.opacity = 0.9 * Math.sin(Math.PI * age) * prog(t, 63.3, 63.9);
          });
        }

        let blur = 0;
        for (const cut of BLUR_CUTS) {
          if (t >= cut - 0.26 && t < cut) blur = Math.max(blur, 26 * eIn(prog(t, cut - 0.26, cut)));
          if (t >= cut && t < cut + 0.42) blur = Math.max(blur, 26 * (1 - eOut(prog(t, cut, cut + 0.42))));
        }
        canvas.style.filter = blur > 0.05 ? "blur(" + blur.toFixed(2) + "px)" : "none";
        canvas.style.transform = blur > 0.05 ? "scale(" + (1 + blur * 0.004).toFixed(4) + ")" : "none";
        renderer.render(scene, camera);
        bctx.globalCompositeOperation = "source-over";
        bctx.drawImage(canvas, 0, 0, 270, 480);
        bctx.globalCompositeOperation = "multiply";
        bctx.drawImage(canvas, 0, 0, 270, 480);
        bctx.drawImage(canvas, 0, 0, 270, 480);
        bloomEl.style.filter = "blur(" + (16 + blur).toFixed(1) + "px)";
        let sw = 0;
        for (const cut of BLUR_CUTS) if (t >= cut - 0.2 && t < cut + 0.2) sw = prog(t, cut - 0.2, cut + 0.2);
        sweepEl.style.opacity = sw > 0 ? String(Math.sin(Math.PI * sw)) : "0";
        sweepEl.style.transform = "translateY(" + (sw * 1920).toFixed(1) + "px)";
        // Destello de cámara en los cortes con Shutter.
        let fl = 0;
        for (const cut of FLASH_CUTS) if (t >= cut && t < cut + 0.5) fl = Math.max(fl, 0.75 * Math.exp(-(t - cut) * 9));
        flashEl.style.opacity = fl.toFixed(3);
      }

      // Todo texto entra y sale con Fade In y Fade Out.
      const tl = gsap.timeline({ paused: true });
      [["#c-n1", 0.69, 3.42], ["#c-inf", 3.72, 5.72], ["#c-teen", 5.95, 10.37], ["#c-36", 10.55, 14.87], ["#pi-chile", 15.0, 17.27], ["#pi-ocde", 15.15, 17.27], ["#t-src1", 15.2, 17.27], ["#c-9", 17.75, 20.47], ["#c-5", 18.6, 20.47], ["#c-rend", 22.83, 24.47], ["#t-src2", 21.7, 24.47], ["#c-l1", 30.95, 33.05], ["#c-l2", 33.2, 36.95], ["#c-l3", 37.1, 39.8], ["#c-l4", 39.95, 43.0], ["#pi-neuro", 48.83, 50.17], ["#c-ref", 50.25, 53.37], ["#c-coord", 51.51, 53.37], ["#pi-salud", 54.05, 55.07], ["#pi-clock", 61.41, 63.17], ["#c-logro", 65.35, 66.98]].forEach(([sel, at, end]) => {
        tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "sine.inOut" }, at);
        tl.to(sel, { opacity: 0, duration: 0.28, ease: "sine.inOut" }, end - 0.29);
      });
      // Sellos: se estampan con un golpe breve, también con fundido.
      [["#s-mund", 27.75, 30.6, 0.94], ["#s-mod", 55.87, 58.3, 0.94]].forEach(([sel, at, end, op]) => {
        tl.fromTo(sel, { opacity: 0, scale: 1.45 }, { opacity: op, scale: 1, duration: 0.2, ease: "power3.in" }, at);
        tl.to(sel, { opacity: 0, duration: 0.28, ease: "sine.inOut" }, end - 0.29);
      });
      // Nota a mano: se escribe de izquierda a derecha y se desvanece.
      [["#n-ojo", 25.27, 26.62]].forEach(([sel, at, end]) => {
        tl.fromTo(sel, { clipPath: "inset(-30% 100% -30% -5%)", opacity: 0 }, { clipPath: "inset(-30% -5% -30% -5%)", opacity: 1, duration: 0.45, ease: "sine.inOut" }, at);
        tl.to(sel, { opacity: 0, duration: 0.28, ease: "sine.inOut" }, end - 0.29);
      });
      tl.fromTo("#e-bg", { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "sine.inOut" }, 67.0);
      tl.fromTo("#e-txt", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "sine.inOut" }, 67.45);
      tl.to("#e-txt", { opacity: 0, duration: 0.3, ease: "sine.inOut" }, 69.65);
      tl.set({}, {}, 70);
      window.__timelines["world"] = tl;

      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      renderAt(0);
    })();
  </script>
</template>
