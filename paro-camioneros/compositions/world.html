        { id: "cut", a: 131.84, b: 135.24, set: monSet, night: true, light: [-6, 14, 12], tg: [0, 1, 0], r: 12, cam: [K(131.84, [4.0, 12.5, 22.5], [1.5, 0, 3.4]), K(135.24, [3.0, 11.8, 21.0], [1.4, 0, 3.4])] },

      ];
      const SH = Object.fromEntries(SHOTS.map((s) => [s.id, s]));
      const allSets = SHOTS.map((s) => s.set).filter((s, i, a) => a.indexOf(s) === i);
      const BLUR_CUTS = [34.26, 65.78, 90.24, 114.74];
      const FLASH_CUTS = [1.94, 3.82, 27.68, 104.8, 116.1];

      // Tarjetas: [tarjeta, toma, aparece, sale, x, y, alto en px, instante de encuadre, fracción de distancia]
      const CARDS = [
        [fKastC, "hwy", 1.94, 999, 540, 760, 640, 2.6, 0.5],
        [fFila, "fila", 3.82, 6.9, 540, 700, 430, 4.6, 0.5],
        [fBloq, "mapB", 27.68, 999, 540, 720, 430, 28.4, 0.5],
        [fAraya, "araya", 104.8, 999, 540, 760, 560, 105.5, 0.55],
        [fKastP, "kastp", 116.1, 999, 540, 720, 450, 116.8, 0.55],
      ];
      CARDS.forEach(([card, sid, at, end, px, py, hpx, ta, frac]) => anchorCard(card, SH[sid], ta, px, py, hpx, frac));

      const WHITE = C("#ffffff"), MOON = C("#dfe3f5");
      let fiveK = 0;
      function updateScene(t, shot) {
        allSets.forEach((s) => (s.visible = s === shot.set));
        scene.background = gradTex;
        const c = path(shot.cam, t);
        camera.position.set(c.p[0] + Math.sin(t * 0.63) * 0.05, c.p[1] + Math.sin(t * 0.81 + 1.3) * 0.04, c.p[2]);
        camera.up.set(0, 1, 0);
        camera.lookAt(c.g[0], c.g[1], c.g[2]);
        camera.updateMatrixWorld(true);
        sunLight.position.set(shot.light[0], shot.light[1], shot.light[2]);
        sunLight.target.position.set(shot.tg[0], shot.tg[1], shot.tg[2]);
        sunLight.intensity = shot.sun || (shot.night ? NIGHT.sun : 2.2);
        sunLight.color.copy(shot.night ? MOON : WHITE);
        const sc = sunLight.shadow.camera;
        sc.left = -shot.r; sc.right = shot.r; sc.top = shot.r; sc.bottom = -shot.r; sc.near = 1; sc.far = 220;
        sc.updateProjectionMatrix();
        hemi.intensity = shot.night ? NIGHT.hemi : 0.5;
        rimLight.intensity = shot.night ? NIGHT.rim : 1.5;
        scene.fog.near = shot.fog ? shot.fog[0] : 400; scene.fog.far = shot.fog ? shot.fog[1] : 900;
        alarmLight.intensity = 0;
        // Luces de emergencia: parpadean todas juntas.
        const hz = Math.floor(t * 3.0) % 2 === 0;
        HAZ.color.set(hz ? "#ffb04a" : "#3a2008");
        HAZG.opacity = hz ? 0.75 : 0;
        CARDS.forEach(([card, sid, at, end], i) => { if (card.g.parent === shot.set) card.g.visible = false; if (sid === shot.id) showCard(card, t, at, end, i); });

        if (shot.set === hwySet) {
          signGantry.visible = shot.id === "sign";
          drawLed(t);
          ledGlow.material.opacity = t >= 9.0 ? 0.25 + 0.15 * (Math.floor((t - 9.0) * 2.2) % 2 === 0 ? 1 : 0) : 0;
        }

        if (shot.set === pumpSet) {
          drawPump(t);
          pumpGlow.material.opacity = 0.32 * io(prog(t, 13.4, 15.6));
          nozzle.rotation.z = Math.sin(t * 1.5) * 0.02;
        }

        if (shot.set === tagSet) {
          // El camión avanza y pasa bajo el pórtico: los lectores destellan (cobro).
          const k = prog(t, 17.6, 19.88);
          tagTruck.position.z = mix(-15.5, 9.5, k);
          tagTruck2.position.z = mix(-26, -11, k);
          const passT = 18.75;
          READERS.forEach((R, i) => {
            const d = t - passT - (R.x > 0 ? 0.3 : 0) - i * 0.03;
            const f = d > 0 ? Math.exp(-d * 4) : 0;
            R.led.material.color.set(f > 0.2 ? "#ffffff" : "#3a1030");
            R.gl.material.opacity = 0.9 * f;
            const ph = d > 0 ? clamp(d / 0.7) : 0;
            R.ring.scale.setScalar(1 + ph * 1.6);
            R.ring.material.opacity = d > 0 && d < 0.7 ? (1 - ph) * 0.8 : 0;
          });
          coins.forEach((s, i) => {
            const d = t - passT - 0.1 - i * 0.18;
            s.visible = d > 0 && d < 1.0;
            s.position.set(-1.1 + (i - 1) * 0.7, 5.0 + d * 1.6, 0.6);
            s.material.opacity = d > 0 ? Math.sin(Math.PI * clamp(d / 1.0)) : 0;
          });
        }

        if (shot.set === mapSet) {
          BADGES.forEach((B, i) => {
            const k = settle(prog(t, B.at, B.at + 0.5));
            const out = io(prog(t, 24.7, 25.1));
            B.s.visible = t >= B.at && out < 1;
            B.s.material.opacity = clamp(prog(t, B.at, B.at + 0.2)) * (1 - out);
            const s = 1.05 * Math.max(0.001, k);
            B.s.scale.set(s * 360 / 420, s, 1);
            B.s.position.y = 1.2 + Math.sin(t * 2 + i) * 0.04;
          });
          CUTS.forEach((P, i) => {
            const on = t >= P.at;
            P.g.visible = on;
            const k = settle(prog(t, P.at, P.at + 0.4));
            P.g.scale.setScalar(Math.max(0.001, k));
            const ph = ((t - P.at) * 0.9 + i * 0.13) % 1;
            P.ring.scale.setScalar(1 + ph * 2.2);
            P.ring.material.opacity = on ? (1 - ph) * 0.8 : 0;
            P.gl.material.opacity = 0.5 + 0.25 * Math.sin(t * 6 + i);
          });
          Object.values(ROUTES).forEach((R) => {
            const k = io(prog(t, R.at, R.at + 0.9));
            R.red.visible = k > 0;
            R.red.geometry.setDrawRange(0, Math.floor(R.n * k / 6) * 6);
          });
          routeLabels.forEach((L) => {
            const k = settle(prog(t, L.at, L.at + 0.5));
            L.s.visible = t >= L.at;
            L.s.material.opacity = clamp(prog(t, L.at, L.at + 0.25));
            L.s.scale.set(2.0 * Math.max(0.001, k), 2.0 * 220 / 1024 * Math.max(0.001, k), 1);
          });
          stgoPin.scale.setScalar(1 + 0.15 * Math.sin(t * 4));
        }

        if (shot.set === jamSet) {
          const k = settle(prog(t, 44.64, 45.3));
          clock.visible = shot.id === "clock";
          clock.scale.setScalar(Math.max(0.001, k));
          // Las manecillas giran rápido: avanzan 5 horas y se detienen en las 5:00.
          const h = 5 * eOut(prog(t, 45.95, 47.3));
          minH.rotation.z = -h * Math.PI * 2;
          hourH.rotation.z = -(h / 12) * Math.PI * 2;
          fiveK = eOut(prog(t, 45.95, 47.0));
          clockGlow.visible = clock.visible;
          clockGlow.material.opacity = 0.25 * k + 0.15 * Math.sin(Math.PI * prog(t, 45.95, 47.4));
        }

        if (shot.set === termSet) {
          drawBoard(t);
          boardGlow.material.opacity = t > 52.26 ? 0.18 + 0.08 * (Math.floor(t * 2) % 2) : 0;
        }

        if (shot.set === airSet) {
          lblLatam.visible = lblSky.visible = shot.id === "air";
          lblLatam.material.opacity = clamp(prog(t, 55.3, 55.65)) * (1 - prog(t, 58.8, 59.1));
          lblSky.material.opacity = clamp(prog(t, 55.7, 56.05)) * (1 - prog(t, 58.8, 59.1));
          lblLatam.position.y = 3.6 + Math.sin(t * 1.4) * 0.05; lblSky.position.y = 3.5 + Math.sin(t * 1.4 + 1) * 0.05;
          pass.visible = shot.id === "pass";
          const pk = settle(prog(t, 59.3, 60.0));
          pass.scale.setScalar(Math.max(0.001, pk));
          pass.rotation.set(Math.sin(t * 0.9) * 0.05, mix(-1.2, 0, pk) + Math.sin(t * 0.7) * 0.08, 0.04);
          passGlow.material.opacity = shot.id === "pass" ? 0.3 * pk : 0;
          towerBeacon.material.opacity = Math.floor(t * 1.2) % 2 ? 0.7 : 0.15;
        }

        if (shot.set === wareSet) {
          // "Encendió las alarmas": la baliza roja gira y tiñe la bodega.
          const on = prog(t, 66.9, 67.2);
          beacon.visible = true;
          domeM.emissiveIntensity = 0.3 + 1.6 * on;
          bGlows.forEach((g, i) => {
            const a = t * 7 + i * Math.PI;
            g.position.set(Math.cos(a) * 0.35, 2.05, Math.sin(a) * 0.35);
            g.material.opacity = on * (0.45 + 0.4 * Math.max(0, Math.cos(a - 0.6)));
          });
          alarmLight.position.set(1.15, 2.3, -4.0);
          alarmLight.intensity = on * (2.4 + 2.0 * Math.max(0, Math.sin(t * 7)));
          hemi.intensity = 0.5 * (1 - 0.45 * on);
          sunLight.intensity = 2.2 * (1 - 0.35 * on);
          // La cinta se detiene: las cajas casi no avanzan.
          beltBoxes.forEach((b, i) => { b.position.z = [1.5, 0.2, -1.4, -3.0][i] + 0.25 * eOut(prog(t, 65.78, 67.2)); });
        }

        if (shot.set === thermoSet) {
          // El termómetro de ventas baja (ILUSTRATIVO).
          const k = io(prog(t, 74.0, 76.6));
          column.scale.y = mix(3.3, 0.55, k);
          gifts.forEach((g, i) => { g.position.y = Math.max(0, Math.sin(t * 1.6 + i) * 0.03); g.rotation.z = Math.sin(t * 1.3 + i) * 0.02; });
          thermoGlow.material.opacity = 0.18 + 0.1 * k;
        }

        if (shot.set === streetSet) {
          BAGS.forEach((B) => {
            const k = settle(prog(t, B.at, B.at + 0.45));
            B.m.visible = t >= B.at;
            const s = Math.max(0.001, k) * B.s;
            B.m.scale.set(0.27 * s, 0.23 * s, 0.25 * s);
          });
        }

        if (shot.set === splitSet) {
          PLAQ.forEach((P) => { P.gl.material.opacity = 0.6 * io(prog(t, P.at, P.at + 0.4)) * (shot.id === "table" ? 1 : 0.4); });
          tableGlow.material.opacity = 0.18 + 0.05 * Math.sin(t * 2);
        }

        if (shot.set === caqSet) {
          // "Anarquía": los camiones se mueven sin rumbo; "un cacique por todas partes": aparece un megáfono sobre cada uno.
          CAQ.forEach((q, i) => {
            q.tr.rotation.y = q.base + Math.sin(t * 0.9 + i) * 0.25;
            const k = settle(prog(t, q.at, q.at + 0.45));
            q.m.visible = t >= q.at;
            q.m.scale.setScalar(Math.max(0.001, k) * 1.3);
            q.m.position.y = 2.55 + Math.sin(t * 5 + i) * 0.04;
            const ph = t >= q.at ? ((t - q.at) * 1.8) % 1 : 0;
            q.ring.scale.setScalar(1 + ph * 1.8);
            q.ring.material.opacity = t >= q.at ? (1 - ph) * 0.45 : 0;
          });
        }

        if (shot.set === iceSet) {
          // Se congela en "congelamiento" y se triza en "no ha conseguido desactivar el conflicto".
          const fr = io(prog(t, 120.7, 121.7));
          iceBlock.visible = fr > 0.001;
          iceBlock.scale.set(1, Math.max(0.001, fr), 1);
          const ck = prog(t, 123.1, 124.4);
          drawCracks(ck);
          const sh = t > 123.1 && t < 123.5 ? Math.exp(-(t - 123.1) * 9) : 0;
          iceBlock.position.x = Math.sin(t * 90) * 0.04 * sh;
          frost.forEach((f, i) => {
            const a = i * 2.39, rr2 = 1.6 + (i % 3) * 0.4;
            f.position.set(Math.cos(a) * rr2, 0.3 + (i * 0.47) % 3.2, 1.1 + Math.sin(a) * 0.2);
            f.material.opacity = fr * (0.12 + 0.1 * Math.sin(t * 3 + i)) * (1 - 0.5 * ck);
          });
          BARS.forEach((B, i) => { B.b.scale.y = B.h * (shot.id === "kastp" ? 1 : 1) + (fr < 1 ? Math.sin(t * 2 + i) * 0.02 * (1 - fr) : 0); });
        }

        if (shot.set === monSet) {
          sweepPivot.rotation.y = -t * 1.6;
          CROWDS.forEach((Cw, ci) => {
            const k = settle(prog(t, Cw.at, Cw.at + 0.6));
            const vis = t >= Cw.at;
            Cw.m.visible = vis; Cw.g.visible = vis;
            Cw.pts.forEach(([x, z, ph], i) => {
              const s = Math.max(0.001, k);
              dmy.position.set(x + Math.sin(t * 1.5 + ph * 6) * 0.04, 0.28 + Math.abs(Math.sin(t * 4 + ph * 9)) * 0.06, z);
              dmy.rotation.set(0, 0, 0); dmy.scale.setScalar(s); dmy.updateMatrix();
              Cw.m.setMatrixAt(i, dmy.matrix);
            });
            Cw.m.instanceMatrix.needsUpdate = true;
            Cw.banner.scale.setScalar(Math.max(0.001, k));
            Cw.rings.forEach((r, i) => { const ph = vis ? ((t - Cw.at) * 0.8 + i * 0.5) % 1 : 0; r.scale.setScalar(0.4 + ph); r.material.opacity = vis ? (1 - ph) * 0.6 : 0; });
            Cw.label.visible = vis && shot.id !== "quest";
            Cw.label.material.opacity = clamp(prog(t, Cw.at + 0.1, Cw.at + 0.35));
            Cw.label.position.y = 2.2 + Math.sin(t * 1.5 + ci) * 0.05;
          });
          const q = settle(prog(t, 135.3, 136.4));
          qMark.visible = t >= 135.3;
          qMark.position.y = mix(-1.5, 5.9, Math.min(1.05, q));
          qInner.rotation.y = Math.sin(t * 0.8) * 0.35;
          qGlow.material.opacity = 0.32 * clamp(q);
        }
      }

      const SUBS = 6, SHUTTER = 1 / 120;
      const grainEl = document.getElementById("w-grain");
      const grctx = grainEl.getContext("2d");
      const grImg = grctx.createImageData(540, 960);
      function drawGrain(t) {
        const r = rng(Math.round(t * 60) + 7);
        const d = grImg.data;
        for (let i = 0; i < d.length; i += 4) { const g = r() * 255; d[i] = d[i + 1] = d[i + 2] = g; d[i + 3] = 255; }
        grctx.putImageData(grImg, 0, 0);
      }
      const n5h = document.getElementById("n-5h");
      function updateHtml(t) { n5h.textContent = String(Math.round(5 * fiveK)); }
      function renderAt(t) {
        t = clamp(t, 0, DUR - 1 / 120);
        let si = SHOTS.findIndex((s) => t >= s.a && t < s.b);
        if (si < 0) si = SHOTS.length - 1;
        const shot = SHOTS[si];
        outCtx.globalCompositeOperation = "source-over";
        for (let k = SUBS - 1; k >= 0; k--) {
          const tk = Math.max(shot.a, t - (k / (SUBS - 1)) * SHUTTER);
          updateScene(tk, shot);
          renderer.render(scene, camera);
          outCtx.globalAlpha = 1 / (SUBS - k);
          outCtx.drawImage(glCanvas, 0, 0);
        }
        outCtx.globalAlpha = 1;
        drawGrain(t);
        updateHtml(t);
        let blur = 0;
        for (const cut of BLUR_CUTS) {
          if (t >= cut - 0.26 && t < cut) blur = Math.max(blur, 26 * eIn(prog(t, cut - 0.26, cut)));
          if (t >= cut && t < cut + 0.42) blur = Math.max(blur, 26 * (1 - eOut(prog(t, cut, cut + 0.42))));
        }
        canvas.style.filter = blur > 0.05 ? "blur(" + blur.toFixed(2) + "px)" : "none";
        canvas.style.transform = blur > 0.05 ? "scale(" + (1 + blur * 0.004).toFixed(4) + ")" : "none";
        bctx.globalCompositeOperation = "source-over";
        bctx.drawImage(canvas, 0, 0, 270, 480);
        bctx.globalCompositeOperation = "multiply";
        bctx.drawImage(canvas, 0, 0, 270, 480);
        bctx.drawImage(canvas, 0, 0, 270, 480);
        bloomEl.style.filter = "blur(" + (16 + blur).toFixed(1) + "px)";
        let sw = 0;
        for (const cut of BLUR_CUTS) if (t >= cut - 0.2 && t < cut + 0.2) sw = prog(t, cut - 0.2, cut + 0.2);
        sweepEl.style.opacity = sw > 0 ? String(Math.sin(Math.PI * sw)) : "0";
        sweepEl.style.transform = "translateY(" + (sw * 1920).toFixed(1) + "px)";
        let fl = 0;
        for (const cut of FLASH_CUTS) if (t >= cut && t < cut + 0.6) fl = Math.max(fl, 0.75 * (Math.exp(-(t - cut) * 9) - Math.exp(-5.4)) / (1 - Math.exp(-5.4)));
        flashEl.style.opacity = fl.toFixed(3);
      }

      // Todo texto entra y sale con Fade In y Fade Out.
      const tl = gsap.timeline({ paused: true });
      [["#c-crisis", 0.12, 3.62], ["#c-paro", 3.82, 8.82], ["#t-src0", 3.82, 11.82], ["#c-diesel", 13.4, 16.72], ["#c-tag", 16.82, 19.82], ["#t-src1", 11.94, 19.82],
       ["#c-suman", 19.95, 24.8], ["#c-cortes", 24.86, 30.06], ["#t-src2", 19.95, 34.2], ["#c-cong", 39.38, 44.48], ["#c-5h", 44.64, 48.44], ["#t-src3", 44.64, 48.44],
       ["#c-pm", 49.86, 54.46], ["#t-src4", 48.56, 54.46], ["#c-air", 54.66, 59.06], ["#c-latam", 59.12, 65.7], ["#t-src5", 54.66, 65.7],
       ["#c-cnc", 69.44, 73.3], ["#c-ventas", 73.42, 77.32], ["#t-src6", 68.0, 77.3], ["#c-muni", 77.5, 81.6], ["#c-basura", 84.6, 90.1], ["#t-src7", 77.5, 90.1],
       ["#c-div", 92.04, 98.54], ["#c-cndc", 98.78, 102.4], ["#c-cntc", 99.52, 102.4], ["#c-nego", 102.5, 104.5], ["#c-araya", 105.0, 110.8], ["#t-src8", 92.04, 114.64],
       ["#q-1", 110.94, 114.64], ["#q-2", 112.3, 114.64], ["#q-3", 113.28, 114.64], ["#q-4", 110.94, 114.64],
       ["#c-gob", 116.1, 119.9], ["#c-feb", 121.6, 125.5], ["#t-src9", 116.1, 125.5], ["#c-est", 128.0, 131.6], ["#c-cut", 131.84, 135.2], ["#t-src10", 128.0, 135.2],
       ["#c-qa", 137.42, 144.12], ["#c-qb", 139.34, 144.12]].forEach(([sel, at, end]) => {
        tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "sine.inOut" }, at);
        tl.to(sel, { opacity: 0, duration: 0.28, ease: "sine.inOut" }, end - 0.29);
      });
      // Sellos: se estampan con un golpe breve, también con fundido.
      [["#s-costo", 61.68, 65.7], ["#s-cnc", 68.0, 73.3], ["#s-nosum", 100.62, 104.52]].forEach(([sel, at, end]) => {
        tl.fromTo(sel, { opacity: 0, scale: 1.45 }, { opacity: 0.94, scale: 1, duration: 0.2, ease: "power3.in" }, at - 0.2);
        tl.to(sel, { opacity: 0, duration: 0.28, ease: "sine.inOut" }, end - 0.29);
      });
      // Nota a mano: se escribe de izquierda a derecha y se desvanece.
      tl.fromTo("#n-tri", { clipPath: "inset(-30% 100% -30% -5%)", opacity: 0 }, { clipPath: "inset(-30% -5% -30% -5%)", opacity: 1, duration: 0.45, ease: "sine.inOut" }, 123.5);
      tl.to("#n-tri", { opacity: 0, duration: 0.25, ease: "sine.inOut" }, 125.24);
      // Grieta luminosa que divide la pantalla.
      tl.fromTo("#w-crack", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "sine.inOut" }, 92.0);
      tl.fromTo("#crack-p", { strokeDashoffset: 1.1 }, { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, 92.04);
      tl.to("#w-crack", { opacity: 0, duration: 0.3, ease: "sine.inOut" }, 98.3);
      tl.fromTo("#e-bg", { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "sine.inOut" }, 144.2);
      tl.fromTo("#e-txt", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "sine.inOut" }, 144.65);
      tl.to("#e-txt", { opacity: 0, duration: 0.3, ease: "sine.inOut" }, 146.85);
      tl.set({}, {}, 147.2);
      window.__timelines["world"] = tl;
      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { painters.forEach((p) => p()); [ledT, pumpT, boardT].forEach((o) => (o.key = null)); });
      renderAt(0);
    })();
  </script>
