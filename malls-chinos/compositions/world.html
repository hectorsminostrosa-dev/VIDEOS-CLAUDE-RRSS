      const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));

      const io = (x) => x * x * x * (x * (x * 6 - 15) + 10);

      function rng(seed) {
        return function () {
          seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
          let r = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
          return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
        };
      }
      const C = (hex) => new THREE.Color(hex);

      // El render 3D va a un canvas fuera de pantalla y se acumula en #w-canvas (motion blur real).

        envScene.add(m);
      };

      envPanel(4, 3, "#ee8ccb", 1.2, 6, 1, -6);

      const fogAisle = new THREE.Fog(0x050507, 9, 46);
      const bloomEl = document.getElementById("w-bloom");

      const sweepEl = document.getElementById("w-sweep");
      const gradC = document.createElement("canvas");

      const gctx = gradC.getContext("2d");
      const grd = gctx.createLinearGradient(0, 0, 0, 256);
      grd.addColorStop(0, "#000000"); grd.addColorStop(0.3, "#12050f"); grd.addColorStop(0.52, "#4a1238"); grd.addColorStop(0.7, "#12050f");
      gctx.fillStyle = grd; gctx.fillRect(0, 0, 4, 256);
      const gradTex = new THREE.CanvasTexture(gradC);
      gradTex.colorSpace = THREE.SRGBColorSpace;
      // Fondo gris carbón para el tramo de los 3 ejes (expedientes).
      const charC = document.createElement("canvas");
      charC.width = 4; charC.height = 256;
      const chctx = charC.getContext("2d");
      const chg = chctx.createLinearGradient(0, 0, 0, 256);
      chg.addColorStop(0, "#0b0b0e"); chg.addColorStop(0.45, "#26262d"); chg.addColorStop(0.62, "#2e1428"); chg.addColorStop(1, "#0b0b0e");
      chctx.fillStyle = chg; chctx.fillRect(0, 0, 4, 256);
      const charTex = new THREE.CanvasTexture(charC);
      charTex.colorSpace = THREE.SRGBColorSpace;
      function addGrid(parent, op) {
        const g = new THREE.GridHelper(240, 96, 0xCA3390, 0xCA3390);
        g.material.transparent = true; g.material.opacity = op; g.material.depthWrite = false;
        g.position.y = 0.02;
        parent.add(g);
      }

      /* ---------- Piezas lisas ---------- */
      const mat = (color, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color, flatShading: false, roughness: 0.78, metalness: 0 }, o));
      const basic = (color, o = {}) => new THREE.MeshBasicMaterial(Object.assign({ color }, o));
      function add(geo, color, x, y, z, parent, o = {}) {
        const m = new THREE.Mesh(geo, color && color.isMaterial ? color : mat(color));
        m.position.set(x, y, z);
        m.castShadow = o.cast !== false;
        m.receiveShadow = o.recv !== false;
        parent.add(m);
        return m;
      }
      const box = (w, h, d, color, x, y, z, parent, o) => add(new THREE.BoxGeometry(w, h, d), color, x, y, z, parent, o);
      const cyl = (r1, r2, h, color, x, y, z, parent, o) => add(new THREE.CylinderGeometry(r1, r2, h, 48), color, x, y, z, parent, o);
      const ball = (r, color, x, y, z, parent, o) => add(new THREE.SphereGeometry(r, 40, 28), color, x, y, z, parent, o);
      const group = (parent, x = 0, y = 0, z = 0) => { const g = new THREE.Group(); g.position.set(x, y, z); parent.add(g); return g; };
      function roundedGeo(w, h, d, r) {
        r = Math.min(r, Math.min(w, h, d) / 2 - 0.001);
        const s = new THREE.Shape();
        const x = -w / 2 + r, y = -h / 2 + r, iw = w - 2 * r, ih = h - 2 * r;
        s.moveTo(x, y - r);
        s.lineTo(x + iw, y - r);
        s.absarc(x + iw, y, r, -Math.PI / 2, 0, false);
        s.lineTo(x + iw + r, y + ih);
        s.absarc(x + iw, y + ih, r, 0, Math.PI / 2, false);
        s.lineTo(x, y + ih + r);
        s.absarc(x, y + ih, r, Math.PI / 2, Math.PI, false);
        s.lineTo(x - r, y);
        s.absarc(x, y, r, Math.PI, Math.PI * 1.5, false);
        const g = new THREE.ExtrudeGeometry(s, { depth: Math.max(0.001, d - 2 * r), bevelEnabled: true, bevelThickness: r, bevelSize: r, bevelOffset: -r, bevelSegments: 6, curveSegments: 10 });
        g.translate(0, 0, -(d - 2 * r) / 2);
        return g;
      }
      const rb = (w, h, d, r, color, x, y, z, parent, o) => add(roundedGeo(w, h, d, r), color, x, y, z, parent, o);
      function lathe(points, color, x, y, z, parent, o) {
        return add(new THREE.LatheGeometry(points.map((p) => new THREE.Vector2(p[0], p[1])), 72), color, x, y, z, parent, o);
      }
      function floorSet(parent, color, op, rough = 0.78) {
        const f = box(420, 1, 420, mat(color, { roughness: rough, metalness: rough < 0.5 ? 0.2 : 0 }), 0, -0.5, 0, parent, { cast: false });
        addGrid(parent, op);
        return f;
      }
      // Texturas de texto: se dibujan al cargar y otra vez cuando las fuentes están listas.
      const painters = [];
      function paintTex(w, h, draw) {
        const c = document.createElement("canvas");
        c.width = w; c.height = h;
        const tx = new THREE.CanvasTexture(c);
        tx.colorSpace = THREE.SRGBColorSpace;
        tx.anisotropy = 8;
        const run = () => { const x = c.getContext("2d"); x.clearRect(0, 0, w, h); draw(x, w, h); tx.needsUpdate = true; };
        run();
        painters.push(run);
        return tx;
      }
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => painters.forEach((p) => p()));
      function rr(c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); }
      function txt(c, s, x, y, font, color, align = "center") { c.font = font; c.fillStyle = color; c.textAlign = align; c.textBaseline = "middle"; c.fillText(s, x, y); }
      const MONT = (px) => "700 " + px + "px Montserrat, sans-serif";
      const BAHN = (px) => px + "px Bahnschrift, sans-serif";
      function plane(w, h, tex, x, y, z, parent, o = {}) {
        const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), o.lit ? mat("#ffffff", { map: tex, roughness: 0.85, transparent: !!o.transparent }) : basic("#ffffff", { map: tex, transparent: o.transparent !== false, depthWrite: !o.transparent }));
        m.position.set(x, y, z);
        m.castShadow = false; m.receiveShadow = !!o.lit;
        parent.add(m);
        return m;
      }
      const puffCanvas = document.createElement("canvas");
      puffCanvas.width = puffCanvas.height = 128;
      const pctx = puffCanvas.getContext("2d");
      const pgrad = pctx.createRadialGradient(64, 64, 4, 64, 64, 64);
      pgrad.addColorStop(0, "rgba(255,255,255,1)");
      pgrad.addColorStop(0.5, "rgba(255,255,255,0.45)");
      pgrad.addColorStop(1, "rgba(255,255,255,0)");
      pctx.fillStyle = pgrad;
      pctx.fillRect(0, 0, 128, 128);
      const puffTex = new THREE.CanvasTexture(puffCanvas);
      const glowMat = (color, op = 0) => new THREE.SpriteMaterial({ map: puffTex, color, transparent: true, opacity: op, depthWrite: false, blending: THREE.AdditiveBlending });
      const smokeMat = (op = 0) => new THREE.SpriteMaterial({ map: puffTex, color: "#8a8a96", transparent: true, opacity: op, depthWrite: false });

      /* ---------- Fachadas (texturas) ---------- */
      function ledDots(c, x, y, w, h, step, r) {
        let k = 0;
        const dot = (px, py) => { c.fillStyle = k++ % 2 ? "#ffffff" : "#ee8ccb"; c.beginPath(); c.arc(px, py, r, 0, Math.PI * 2); c.fill(); };
        for (let px = x; px <= x + w; px += step) { dot(px, y); dot(px, y + h); }
        for (let py = y + step; py < y + h; py += step) { dot(x, py); dot(x + w, py); }
      }
      function goods(c, x, y, w, h, seed, palette) {
        const r = rng(seed);
        c.fillStyle = "#1a1a22"; rr(c, x, y, w, h, 14); c.fill();
        for (let row = 0; row < 3; row++) {
          const sy = y + 30 + row * (h - 40) / 3;
          c.fillStyle = "#3a3a44"; c.fillRect(x + 12, sy + (h - 40) / 3 - 14, w - 24, 6);
          for (let px = x + 20; px < x + w - 30;) {
            const bw = 18 + r() * 30, bh = 26 + r() * ((h - 40) / 3 - 50);
            c.fillStyle = palette[Math.floor(r() * palette.length)];
            rr(c, px, sy + (h - 40) / 3 - 14 - bh, bw, bh, 5); c.fill();
            px += bw + 6;
          }
        }
        c.strokeStyle = "rgba(255,255,255,0.14)"; c.lineWidth = 4; rr(c, x, y, w, h, 14); c.stroke();
      }
      const MALL_GOODS = ["#7a1f5c", "#4e6a4a", "#6a6a75", "#CA3390", "#a08a5a", "#2a6a7a", "#ee8ccb"];
      const mallTex = paintTex(1024, 768, (c, w, h) => {
        c.fillStyle = "#121216"; c.fillRect(0, 0, w, h);
        const g = c.createLinearGradient(0, 20, 0, 220); g.addColorStop(0, "#3d0f33"); g.addColorStop(1, "#1d0619");

        c.save(); c.shadowColor = "#CA0010"; c.shadowBlur = 28;
        txt(c, "MALL CHINO", w / 2, 124, MONT(122), "#ffffff");
        c.restore();
        ledDots(c, 40, 34, 944, 172, 31, 6);
        goods(c, 40, 262, 340, 470, 11, MALL_GOODS);
        goods(c, 644, 262, 340, 470, 12, MALL_GOODS);
        c.fillStyle = "#24242c"; rr(c, 410, 262, 204, 506, 10); c.fill();
        c.fillStyle = "rgba(238,140,203,0.16)"; rr(c, 426, 280, 172, 440, 8); c.fill();
        c.fillStyle = "#CA3390"; rr(c, 440, 300, 144, 46, 10); c.fill();
        txt(c, "ABIERTO", 512, 324, BAHN(30), "#ffffff");
      });
      function oldShop(name, wall, sign, seed, palette) {
        return paintTex(1024, 768, (c, w, h) => {
          c.fillStyle = wall; c.fillRect(0, 0, w, h);
          c.fillStyle = sign; rr(c, 40, 30, 944, 180, 16); c.fill();

      const allSets = SHOTS.map((s) => s.set).filter((s, i, a) => a.indexOf(s) === i);

      // Sacudidas: suma de senos (continua y determinista).
      const shake = (t, f) => [Math.sin(t * f) * 0.6 + Math.sin(t * f * 2.31 + 1.7) * 0.4, Math.sin(t * f * 1.37 + 0.4) * 0.6 + Math.sin(t * f * 2.9 + 2.2) * 0.4];

      function updateScene(t, shot) {
        allSets.forEach((s) => (s.visible = s === shot.set));
        scene.background = shot.grad ? gradTex : shot.tex ? shot.tex : C(shot.bg);
        scene.fog = shot.fog ? fogAisle : null;
        const c = path(shot.cam, t);
        let sx = 0, sy = 0;
        if (shot.set === streetSet && !shot.quake) { const a = 0.14 * Math.exp(-Math.max(0, t - 3.98) * 7) * (t >= 3.98 ? 1 : 0); const sh = shake(t, 41); sx = sh[0] * a; sy = sh[1] * a; }
        if (shot.quake) { const a = 0.2 * prog(t, 61.37, 61.7) * (1 - 0.4 * prog(t, 63.3, 63.99)); const sh = shake(t, 33); sx = sh[0] * a; sy = sh[1] * a; }
        let gx = 0;
        if (shot.set === ejesSet) gx = 9 * Math.pow(1 - eOut(prog(t, 15.35, 16.05)), 2); // barrido lateral rápido (whip pan) que frena en los expedientes
        // Leve deriva de cámara, como un operador muy estable: suma de senos lentos, siempre continua.
        camera.position.set(c.p[0] + Math.sin(t * 0.63) * 0.05 + sx + gx, c.p[1] + Math.sin(t * 0.81 + 1.3) * 0.04 + sy, c.p[2]);

        camera.lookAt(c.g[0] + sx * 0.5 + gx, c.g[1] + sy * 0.5, c.g[2]);
        camera.updateMatrixWorld(true);
        sunLight.position.set(shot.light[0], shot.light[1], shot.light[2]);
        sunLight.target.position.set(shot.tg[0], shot.tg[1], shot.tg[2]);
        sunLight.intensity = 2.2;
        const sc = sunLight.shadow.camera;
        sc.left = -shot.r; sc.right = shot.r; sc.top = shot.r; sc.bottom = -shot.r; sc.near = 1; sc.far = 220;
        sc.updateProjectionMatrix();
        hemi.intensity = 0.5;

        if (shot.set === mapSet) {
          const a3 = t >= 46.51;

          layers.forEach((L, k) => {

            L.g.position.y = 0.34 + (k + 1) * 2.4 * p;

          const foc = a3 ? io(prog(t, 48.6, 49.3)) : 0;
          Object.entries(REG).forEach(([name, R]) => {
            const isL = R === lagos;

              const pulse = 0.5 + 0.5 * Math.sin((t - 48.6) * 7.5);

            P.obj.rotation.set(P.rot[0] * (1 - k), P.rot[1] * (1 - k), P.rot[2] * (1 - k));
          });

          rLans.forEach((l) => { l.body.material.emissiveIntensity = 0.15 + 0.85 * on; l.glow.material.opacity = 0.55 * on; });
          const sk = settle(prog(t, 67.81, 68.25));
          sign.scale.set(1, Math.max(0.001, sk), 1);
          sign.visible = t >= 67.81;
          nekoMini.paw.rotation.set(-0.35 + 0.6 * Math.sin(t * 27), 0, -0.2);
          nekoMini.g.visible = t >= 65.4;
          nekoMini.g.scale.setScalar(0.36 * settle(prog(t, 65.4, 65.9)) + 0.0001);
        }
      }

      // Motion blur real: 6 muestras dentro de un obturador de 180° a 60 fps (1/120 s), promediadas.
      // Nunca mezcla dos tomas: las muestras no retroceden antes del inicio de la toma actual.
      const SUBS = 6, SHUTTER = 1 / 120;
      const grainEl = document.getElementById("w-grain");
      const grctx = grainEl.getContext("2d");
      const grImg = grctx.createImageData(540, 960);
      function drawGrain(t) {
        const r = rng(Math.round(t * 60) + 7);
        const d = grImg.data;
        for (let i = 0; i < d.length; i += 4) { const g = r() * 255; d[i] = d[i + 1] = d[i + 2] = g; d[i + 3] = 255; }
        grctx.putImageData(grImg, 0, 0);
      }
      const fmt1 = (v) => v.toFixed(1).replace(".", ",");
      const el = (id) => document.getElementById(id);
      const n87 = el("n-87"), n622 = el("n-622"), n514 = el("n-514"), n26 = el("n-26");
      function updateHtml(t) {
        n87.textContent = String(Math.round(87 * eOut(prog(t, 36.61, 37.25))));
        n622.textContent = fmt1(62.2 * eOut(prog(t, 38.81, 39.6))) + "%";
        n514.textContent = fmt1(51.4 * eOut(prog(t, 43.17, 43.9))) + "%";
        n26.textContent = Math.round(26 * eOut(prog(t, 51.39, 51.95))) + "%";
      }
      function renderAt(t) {
        t = clamp(t, 0, DUR - 1 / 120);
        const shot = SHOTS.find((s) => t >= s.a && t < s.b) || SHOTS[SHOTS.length - 1];
        outCtx.globalCompositeOperation = "source-over";
        for (let k = SUBS - 1; k >= 0; k--) {
          const tk = Math.max(shot.a, t - (k / (SUBS - 1)) * SHUTTER);
          updateScene(tk, shot);
          renderer.render(scene, camera);
          outCtx.globalAlpha = 1 / (SUBS - k);
          outCtx.drawImage(glCanvas, 0, 0);
        }
        outCtx.globalAlpha = 1;
        drawGrain(t);
        updateHtml(t);
        let blur = 0;
        for (const cut of BLUR_CUTS) {
          if (t >= cut - 0.26 && t < cut) blur = Math.max(blur, 26 * eIn(prog(t, cut - 0.26, cut)));
          if (t >= cut && t < cut + 0.42) blur = Math.max(blur, 26 * (1 - eOut(prog(t, cut, cut + 0.42))));
        }
        canvas.style.filter = blur > 0.05 ? "blur(" + blur.toFixed(2) + "px)" : "none";
        canvas.style.transform = blur > 0.05 ? "scale(" + (1 + blur * 0.004).toFixed(4) + ")" : "none";
        bctx.globalCompositeOperation = "source-over";
        bctx.drawImage(canvas, 0, 0, 270, 480);
        bctx.globalCompositeOperation = "multiply";
        bctx.drawImage(canvas, 0, 0, 270, 480);
        bctx.drawImage(canvas, 0, 0, 270, 480);
        bloomEl.style.filter = "blur(" + (16 + blur).toFixed(1) + "px)";
        let sw = 0;
        for (const cut of BLUR_CUTS) if (t >= cut - 0.2 && t < cut + 0.2) sw = prog(t, cut - 0.2, cut + 0.2);
        sweepEl.style.opacity = sw > 0 ? String(Math.sin(Math.PI * sw)) : "0";
        sweepEl.style.transform = "translateY(" + (sw * 1920).toFixed(1) + "px)";
      }

      // Todo texto entra y sale con Fade In y Fade Out.
      const tl = gsap.timeline({ paused: true });
      [["#c-ley", 0.05, 3.75], ["#c-otro", 5.95, 8.35], ["#c-pres", 8.7, 11.65], ["#c-149", 23.3, 25.38], ["#t-src149", 23.3, 25.38],
       ["#c-cnc", 34.3, 36.5], ["#c-87", 36.61, 38.6], ["#t-src87", 34.3, 38.6], ["#c-622", 38.81, 42.88], ["#t-src622", 39.0, 42.88],
       ["#c-514", 43.17, 46.42], ["#t-src514", 43.3, 46.42], ["#c-lagos", 48.8, 52.95], ["#c-26", 51.39, 52.95], ["#t-src26", 49.0, 52.95],
       ["#c-neko", 59.09, 60.71], ["#c-inaug", 64.9, 66.8], ["#c-cta", 66.85, 68.55]].forEach(([sel, at, end]) => {
        tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "sine.inOut" }, at);
        tl.to(sel, { opacity: 0, duration: 0.28, ease: "sine.inOut" }, end - 0.29);
      });
      // Cifra gigante tenue de fondo.
      tl.fromTo("#g-622", { opacity: 0 }, { opacity: 0.13, duration: 0.5, ease: "sine.inOut" }, 38.5);
      tl.to("#g-622", { opacity: 0, duration: 0.3, ease: "sine.inOut" }, 42.58);
      // Sellos: se estampan con un golpe breve, también con fundido.
      [["#s-1", 22.53, 25.38], ["#s-2", 25.52, 29.07], ["#s-3", 29.73, 32.53]].forEach(([sel, at, end]) => {
        tl.fromTo(sel, { opacity: 0, scale: 1.45 }, { opacity: 0.94, scale: 1, duration: 0.2, ease: "power3.in" }, at - 0.2);
        tl.to(sel, { opacity: 0, duration: 0.28, ease: "sine.inOut" }, end - 0.29);
      });
      // Nota a mano: se escribe de izquierda a derecha y se desvanece.
      tl.fromTo("#n-pum", { clipPath: "inset(-30% 100% -30% -5%)", opacity: 0 }, { clipPath: "inset(-30% -5% -30% -5%)", opacity: 1, duration: 0.3, ease: "sine.inOut" }, 3.92);
      tl.to("#n-pum", { opacity: 0, duration: 0.28, ease: "sine.inOut" }, 5.03);
      tl.fromTo("#e-bg", { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "sine.inOut" }, 68.6);
      tl.fromTo("#e-txt", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "sine.inOut" }, 69.05);
      tl.to("#e-txt", { opacity: 0, duration: 0.3, ease: "sine.inOut" }, 71.25);
      tl.set({}, {}, 71.6);
      window.__timelines["world"] = tl;

      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      renderAt(0);
    })();
  </script>
</template>
